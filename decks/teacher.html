<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Сданные работы</title>
<style>
:root{--bg:#0b1416;--panel:#11201f;--ink:#d8e6e8;--dim:#7d9599;--cy:#6fe3ea;--cy2:rgba(111,227,234,.35);--rd:#ff6b62;--ok:#7dffb0;--m:"JetBrains Mono",ui-monospace,Consolas,monospace;--f:"Inter",system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f)}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--cy2)}
header h1{margin:0;font:800 16px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
header .sp{flex:1}
button,.btn{border:1px solid var(--cy2);background:transparent;color:var(--cy);font:700 13px var(--m);padding:7px 12px;cursor:pointer}
button:hover{background:var(--cy);color:#0e1b1e}button.pri{background:var(--rd);border-color:var(--rd);color:#fff}button:disabled{opacity:.5;cursor:default}
input,select{background:#0a1416;border:1px solid var(--cy2);color:#fff;font:500 14px var(--m);padding:7px 9px}
main{display:grid;grid-template-columns:minmax(380px,1.1fr) 1fr;gap:0;height:calc(100vh - 58px)}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}}
.col{overflow:auto;padding:14px 20px;min-height:0}.col+.col{border-left:1px solid var(--cy2)}
.flt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.flt input{flex:1;min-width:160px}
table{width:100%;border-collapse:collapse;font:500 13px var(--m)}
th{position:sticky;top:0;background:var(--panel);color:var(--cy);text-align:left;padding:6px 8px;font-weight:700}
td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover td{background:rgba(111,227,234,.07)}tr.on td{background:var(--cy)!important;color:#0e1b1e}
.k{font:700 11px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--rd)}
h2{margin:4px 0 6px;font:800 20px var(--f)}
pre{background:#0a1416;border:1px solid var(--cy2);padding:10px;font:500 12.5px/1.45 var(--m);white-space:pre-wrap;max-height:55vh;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.msg{color:var(--dim);font-size:14px}.err{color:var(--rd)}
.login{max-width:380px;margin:12vh auto;padding:22px;border:1px solid var(--cy2);background:var(--panel)}
.login input{width:100%;margin:8px 0 12px}
.cnt{color:var(--dim);font:500 12px var(--m)}
</style>
</head>
<body>
<header><h1>Сданные работы · эмулятор Eltex</h1><span class="sp"></span><span class="cnt" id="cnt"></span><button id="ref" hidden>Обновить</button><button id="out" hidden>Выйти</button></header>
<section class="login" id="login">
  <div class="k">Вход преподавателя</div>
  <form id="lf"><label for="pw">Пароль</label><input id="pw" type="password" autocomplete="current-password" required><button class="pri" type="submit">Войти</button></form>
  <p class="msg" id="lmsg"></p>
</section>
<main id="app" hidden>
  <div class="col">
    <div class="flt"><select id="fg"><option value="">Все группы</option></select><select id="fl"><option value="">Все лабы</option></select><input id="fq" placeholder="Поиск по ФИО"></div>
    <table><thead><tr><th>Время</th><th>Группа</th><th>Лаба</th><th>ФИО</th></tr></thead><tbody id="tb"></tbody></table>
    <p class="msg" id="empty" hidden>Сдач пока нет.</p>
  </div>
  <div class="col" id="det"><p class="msg">Выберите работу слева.</p></div>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); }, items = [], cur = null;
  function el(tag, text, cls) { var x = document.createElement(tag); if (text !== undefined) x.textContent = text; if (cls) x.className = cls; return x; }
  function api(path, opt) {
    return fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opt || {}))
      .then(function (r) { return r.json().then(function (j) { j.status = r.status; return j; }, function () { return { ok: false, status: r.status, error: 'сервис сдачи недоступен (код ' + r.status + ')' }; }); });
  }
  function show(app) { $('login').hidden = app; $('app').hidden = !app; $('ref').hidden = $('out').hidden = !app; }
  function load() {
    api('/api/teacher/list').then(function (j) {
      if (j.status === 401) { show(false); return; }
      if (!j.ok) { show(false); $('lmsg').textContent = j.error || 'Ошибка'; return; }
      show(true); items = j.items || []; fillFilters(); render();
    }).catch(function () { show(false); $('lmsg').textContent = 'Нет связи с сервисом сдачи.'; });
  }
  function fillFilters() {
    [['fg', 'group', 'Все группы'], ['fl', 'lab', 'Все лабы']].forEach(function (f) {
      var s = $(f[0]), v = s.value, vals = items.map(function (x) { return x[f[1]]; }).filter(function (x, i, a) { return x && a.indexOf(x) === i; }).sort();
      s.textContent = ''; s.appendChild(el('option', f[2])).value = '';
      vals.forEach(function (x) { var o = el('option', x); o.value = x; s.appendChild(o); }); s.value = vals.indexOf(v) >= 0 ? v : ''; });
  }
  function render() {
    var g = $('fg').value, l = $('fl').value, q = $('fq').value.trim().toLowerCase(), tb = $('tb');
    var L = items.filter(function (x) { return (!g || x.group === g) && (!l || x.lab === l) && (!q || String(x.name).toLowerCase().indexOf(q) >= 0); });
    tb.textContent = '';
    L.forEach(function (x) { var tr = el('tr'); if (cur && cur.id === x.id) tr.className = 'on';
      [String(x.time || '').replace('T', ' '), x.group, x.lab, x.name].forEach(function (v) { tr.appendChild(el('td', v)); });
      tr.addEventListener('click', function () { open(x); }); tb.appendChild(tr); });
    $('empty').hidden = L.length > 0; $('cnt').textContent = L.length + ' из ' + items.length;
  }
  function open(x) {
    cur = x; render(); var det = $('det'); det.textContent = ''; det.appendChild(el('p', 'Загрузка…', 'msg'));
    api('/api/teacher/get?id=' + encodeURIComponent(x.id)).then(function (j) {
      det.textContent = '';
      if (!j.ok) { det.appendChild(el('p', j.error || 'Ошибка', 'err')); return; }
      var w = j.item; cur.item = w;
      det.appendChild(el('div', 'Лаба ' + w.lab + (w.title ? ' · ' + w.title : ''), 'k'));
      det.appendChild(el('h2', w.name));
      det.appendChild(el('p', 'Группа ' + w.group + ' · сдано ' + String(w.received || '').replace('T', ' ') + ' · режим ' + (w.mode === 'test' ? '«Тест»' : '«Работа»') +
        ' · устройств ' + ((w.scheme && w.scheme.devs) || []).length, 'msg'));
      var row = el('div', undefined, 'row'), b1 = el('button', 'Открыть в эмуляторе (проверка)'), b2 = el('button', 'Скачать .json');
      b1.className = 'pri'; b1.addEventListener('click', function () { toEmu(w); }); b2.addEventListener('click', function () { dl(w); });
      row.appendChild(b1); row.appendChild(b2); det.appendChild(row);
      det.appendChild(el('div', 'Конфигурации (running-config)', 'k')); det.appendChild(el('pre', w.configs || '— нет MES/ESR —'));
    }).catch(function () { det.textContent = ''; det.appendChild(el('p', 'Нет связи с сервисом сдачи.', 'err')); });
  }
  // эмулятор с той же папки сайта: открывается окно, по сигналу «готов» передаётся схема (postMessage только своему сайту)
  function toEmu(w) {
    var win = window.open('eltex-cli.html', '_blank'); if (!win) { alert('Разрешите всплывающие окна для этого сайта'); return; }
    function onMsg(e) { if (e.source !== win || e.origin !== location.origin || !e.data || e.data.type !== 'elab-ready') return;
      window.removeEventListener('message', onMsg);
      win.postMessage({ type: 'elab-load', scheme: w.scheme, test: true, title: w.name + ' · ' + w.group + ' · ' + w.lab }, location.origin); }
    window.addEventListener('message', onMsg);
  }
  function dl(w) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(w, null, 1)], { type: 'application/json' }));
    a.download = (w.group + '_' + w.name + '_' + w.lab).replace(/[^\wА-Яа-яЁё.-]+/g, '_') + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  $('lf').addEventListener('submit', function (e) { e.preventDefault(); $('lmsg').textContent = '';
    api('/api/teacher/login', { method: 'POST', body: JSON.stringify({ password: $('pw').value }) }).then(function (j) {
      $('pw').value = ''; if (j.ok) load(); else $('lmsg').textContent = j.error || 'Ошибка входа'; })
      .catch(function () { $('lmsg').textContent = 'Нет связи с сервисом сдачи.'; }); });
  $('out').addEventListener('click', function () { api('/api/teacher/logout', { method: 'POST', body: '{}' }).then(function () { items = []; cur = null; show(false); }); });
  $('ref').addEventListener('click', load);
  ['fg', 'fl'].forEach(function (k) { $(k).addEventListener('change', render); }); $('fq').addEventListener('input', render);
  if (location.protocol === 'file:') { $('lmsg').textContent = 'Страница работает только на сайте курса (net-cat.duckdns.org).'; } else load();
})();
</script>
</body>
</html>
