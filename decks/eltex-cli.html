<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eltex NetLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- шрифты не блокируют отрисовку: если Google Fonts тормозит или недоступен, страница сразу рисуется системными -->
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg0:#120a0d; --bg1:#2a1418; --bg2:#0c1320; --panel:rgba(20,10,14,.92); --panel2:rgba(36,18,22,.95);
  --cy:#6fe3ea; --cy2:#3fb7c0; --cyd:rgba(111,227,234,.14); --rd:#d4574f; --rd2:#9b3833; --rdd:rgba(212,87,79,.16);
  --ink:#d9f7f9; --dim:#8fa9ad; --ok:#7dffb0; --bad:#ff6b62; --arp:#ffc65c; --nat:#c79bff;
  --f:'Rajdhani','Segoe UI',sans-serif; --m:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  --cut-s:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:600 16px/1.35 var(--f);letter-spacing:.02em;
  background:radial-gradient(1200px 700px at 30% 10%,#3a1a1e 0,transparent 70%),linear-gradient(180deg,var(--bg1) 0%,#1a0e12 45%,var(--bg2) 100%);background-color:var(--bg0)}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--cy);color:#10181c}
/* ---------- шапка */
.top{position:fixed;left:0;right:0;top:0;height:54px;display:flex;align-items:center;gap:18px;padding:0 18px 0 26px;z-index:30;
  background:linear-gradient(180deg,rgba(18,8,11,.95),rgba(18,8,11,.6));border-bottom:1px solid var(--rd2)}
.logo{display:flex;align-items:center;gap:10px;font:700 22px/1 var(--f);letter-spacing:.12em;color:var(--cy)}
.logo i{width:28px;height:28px;border:2px solid var(--cy);transform:skewX(-14deg);display:grid;place-items:center;font:700 14px var(--m);font-style:normal}
.logo small{display:block;font:600 11px/1.1 var(--m);color:var(--rd);letter-spacing:.08em}
.rule{flex:1;height:22px;position:relative;opacity:.8}
.rule::before{content:'';position:absolute;inset:10px 0 auto;height:2px;background:linear-gradient(90deg,var(--rd2),var(--cy2) 60%,transparent)}
.rule::after{content:'[ · · S · · · W · · · ]';position:absolute;left:30%;top:0;font:600 13px var(--m);color:var(--rd);letter-spacing:.35em}
.stat{font:500 12px/1.3 var(--m);color:var(--dim);text-align:right;white-space:nowrap}
.stat b{color:var(--cy);font-weight:700}
.bar{width:160px;height:26px;background:repeating-linear-gradient(90deg,var(--cy) 0 2px,transparent 2px 4px,var(--cy) 4px 5px,transparent 5px 9px,var(--cy) 9px 12px,transparent 12px 14px);opacity:.75}
.tbtn{border:1px solid var(--cy2);background:var(--cyd);color:var(--cy);padding:6px 12px;clip-path:var(--cut-s);cursor:pointer;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.tbtn:hover{background:var(--cy);color:#0e1b1e}
.mode{display:flex;border:1px solid var(--rd);clip-path:var(--cut-s)}
.mode button{background:transparent;border:0;color:var(--rd);padding:6px 14px;cursor:pointer;font:700 13px var(--f);letter-spacing:.1em;text-transform:uppercase}
.mode button.on{background:var(--rd);color:#1a0b0d}
.mode button:not(.on):hover{background:var(--rdd)}
body:not(.mtest) .t-only,body:not(.mtest) #trace{display:none!important}
.clk{display:flex;align-items:center;gap:8px;font:500 12px var(--m);color:var(--dim)}
.clk .ck{letter-spacing:.12em;color:var(--rd)}
.clk b{font:700 18px var(--m);color:var(--cy);min-width:84px;text-shadow:0 0 10px rgba(111,227,234,.45)}
.clk .cb{display:flex;border:1px solid var(--cy2);clip-path:var(--cut-s)}
.clk .cb button{background:transparent;border:0;border-right:1px solid rgba(111,227,234,.25);color:var(--cy);padding:4px 8px;cursor:pointer;font:700 12px var(--m)}
.clk .cb button:last-child{border-right:0}
.clk .cb button:hover{background:var(--cyd)}
.clk .cb button.on{background:var(--cy);color:#0e1b1e}
.clk .ff button{color:var(--arp)}
.clk.flash b{color:var(--arp)}
@media (max-width:1200px){.clk .ck,.bar{display:none}}
/* ---------- поле */
#cv{position:fixed;left:0;top:54px;width:100%;height:calc(100% - 100px);display:block;cursor:default;
  background-image:linear-gradient(rgba(111,227,234,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(111,227,234,.05) 1px,transparent 1px);background-size:32px 32px}
#cv.pan{cursor:grabbing}
.frame{position:fixed;inset:66px 12px 58px 12px;pointer-events:none;z-index:1;border:1px solid rgba(212,87,79,.35);
  clip-path:polygon(0 0,40% 0,41% 8px,59% 8px,60% 0,100% 0,100% 100%,0 100%)}
.frame::before,.frame::after{content:'';position:absolute;width:22px;height:22px;border:2px solid var(--cy)}
.frame::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.frame::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.ticks{position:fixed;left:6px;top:120px;bottom:120px;width:8px;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(180deg,var(--rd2) 0 2px,transparent 2px 14px)}
.dev{cursor:pointer}
.dev .lbl{font:700 16px var(--f);fill:var(--ink);text-anchor:middle;letter-spacing:.06em;paint-order:stroke;stroke:#140a0d;stroke-width:5}
.dev .mdl{font:500 11px var(--m);fill:var(--dim);text-anchor:middle;paint-order:stroke;stroke:#140a0d;stroke-width:4}
.dev .ring{fill:none;stroke:transparent;stroke-width:2}
.dev.sel .ring{stroke:var(--cy);stroke-dasharray:6 4}
.dev.pick .ring{stroke:var(--arp)}
.dev.off{opacity:.42}
.lnk{stroke:var(--cy2);stroke-width:2.4;cursor:pointer}
.lnk.down{stroke:var(--rd);stroke-dasharray:7 5}
.lnk:hover,.lnk.sel{stroke:var(--cy);stroke-width:4}
.ghost{stroke:var(--arp);stroke-width:2;stroke-dasharray:6 5;pointer-events:none}
.pl rect{fill:#150b0e;stroke:var(--cy2);stroke-width:1}
.pl text{font:700 11px var(--m);fill:var(--cy);text-anchor:middle;dominant-baseline:central}
.led{stroke:#000;stroke-width:.6}
.pkt circle{stroke:#120a0d;stroke-width:2}
.pkt text{font:700 12px var(--m);fill:var(--ink);paint-order:stroke;stroke:#120a0d;stroke-width:3}
/* ---------- левая выезжающая панель */
.edge{position:fixed;left:0;top:54px;bottom:46px;width:16px;z-index:8999}
.edge::after{content:'▶';position:absolute;left:2px;top:50%;color:var(--cy);font-size:12px;opacity:.8}
.side{position:fixed;left:0;top:62px;bottom:54px;width:340px;z-index:9000;transform:translateX(-352px);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  background:var(--panel);border:1px solid var(--rd2);border-left:0;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);display:flex;flex-direction:column}
.side.open,.side.pin{transform:none}
.stabs{display:flex;gap:2px;padding:10px 10px 0}
.stabs button{flex:1;border:1px solid var(--rd2);background:transparent;color:var(--dim);padding:6px 2px;cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.stabs button.on{background:var(--rd);border-color:var(--rd);color:#1a0b0d}
.spin{margin-left:4px;border:1px solid var(--cy2)!important;color:var(--cy)!important;flex:0 0 34px!important}
.spin.on{background:var(--cy)!important;color:#0e1b1e!important}
.sbody{flex:1;overflow:auto;padding:10px 12px 14px}
.sbody h4{margin:14px 0 6px;font:700 12px var(--m);color:var(--rd);letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--rd2);padding-bottom:3px}
.q{width:100%;background:#0d0709;border:1px solid var(--cy2);padding:7px 10px;color:var(--cy);font:500 14px var(--m);outline:0}
.q::placeholder{color:#4f7a7e}
.pi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:rgba(111,227,234,.04);border:1px solid rgba(111,227,234,.18);
  margin:5px 0;padding:6px 8px;cursor:grab;clip-path:var(--cut-s)}
.pi:hover{background:var(--cyd);border-color:var(--cy)}
.pi svg{flex:0 0 42px;height:30px}
.pi b{display:block;font:700 15px var(--f);color:var(--ink);letter-spacing:.05em}
.pi small{display:block;font:500 11px/1.25 var(--m);color:var(--dim)}
.pi .sw{font:700 10px var(--m);color:var(--rd);border:1px solid var(--rd);padding:0 4px;margin-left:6px}
.note{font:500 12px/1.4 var(--m);color:var(--dim);margin-top:12px}
.lbtn{display:block;width:100%;text-align:left;border:1px solid rgba(212,87,79,.35);background:var(--rdd);margin:5px 0;padding:8px 10px;cursor:pointer;clip-path:var(--cut-s)}
.lbtn:hover{border-color:var(--rd);background:rgba(212,87,79,.3)}
.lbtn b{color:var(--cy);font:700 14px var(--m);margin-right:8px}
.act{display:block;width:100%;border:1px solid var(--cy2);background:var(--cyd);color:var(--cy);padding:9px;margin:6px 0;cursor:pointer;font-weight:700;letter-spacing:.08em;text-transform:uppercase;clip-path:var(--cut-s)}
.act:hover{background:var(--cy);color:#0e1b1e}
.act.red{border-color:var(--rd);background:var(--rdd);color:var(--rd)}.act.red:hover{background:var(--rd);color:#1a0b0d}
/* ---------- нижняя панель */
.dock{position:fixed;left:0;right:0;bottom:0;height:46px;z-index:30;display:flex;align-items:center;gap:8px;padding:0 14px;
  background:linear-gradient(0deg,rgba(12,19,32,.97),rgba(12,19,32,.75));border-top:1px solid var(--cy2)}
.term-btn{border:0;background:var(--rd);color:#1a0b0d;padding:8px 18px;font-weight:700;letter-spacing:.1em;cursor:pointer;clip-path:var(--cut-s);text-transform:uppercase}
.term-btn:hover{background:#ef6c63}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1}
.chip{border:1px solid var(--cy2);background:transparent;color:var(--cy);padding:5px 10px;cursor:pointer;font:600 13px var(--m);white-space:nowrap}
.chip.min{opacity:.55;border-style:dashed}
.chip:hover{background:var(--cyd)}
.dhint{font:500 12px var(--m);color:var(--dim);white-space:nowrap}
.dhint b{color:var(--cy)}
/* ---------- контекстное меню */
.ctx{position:fixed;z-index:9500;min-width:230px;background:var(--panel2);border:1px solid var(--cy2);clip-path:var(--cut-s);padding:6px 0;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.ctx .h{padding:4px 14px 6px;font:700 12px var(--m);color:var(--rd);letter-spacing:.12em;border-bottom:1px solid var(--rd2);margin-bottom:4px;text-transform:uppercase}
.ctx button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:6px 14px;cursor:pointer;color:var(--ink);font-weight:600}
.ctx button:hover{background:var(--cy);color:#0e1b1e}
.ctx button span{width:16px;text-align:center;font-family:var(--m)}
.ctx hr{border:0;border-top:1px solid rgba(111,227,234,.15);margin:4px 0}
.ctx .list{max-height:300px;overflow:auto}
.ctx input{margin:4px 10px 6px;width:calc(100% - 20px)}
/* ---------- плавающие окна */
.win{position:fixed;z-index:50;min-width:320px;min-height:160px;display:flex;flex-direction:column;background:rgba(10,6,8,.97);border:1px solid var(--cy2);
  clip-path:var(--cut);resize:both;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.win.focus{border-color:var(--cy);z-index:55}
.win .wt{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;background:linear-gradient(90deg,var(--rd2),rgba(155,56,51,.35) 60%,transparent);cursor:move;user-select:none}
.win .wt b{flex:1;font:700 14px var(--f);letter-spacing:.12em;text-transform:uppercase}
.win .wt small{font:500 11px var(--m);color:var(--cy)}
.win .wt button{border:1px solid rgba(217,247,249,.4);background:transparent;width:24px;height:22px;cursor:pointer;line-height:1;padding:0}
.win .wt button:hover{background:var(--cy);color:#0e1b1e}
.win .wb{flex:1;min-height:0;display:flex;flex-direction:column}
.out{flex:1;overflow:auto;padding:10px 14px;font:500 15px/1.45 var(--m);color:#d8e6e8;white-space:pre-wrap;word-break:break-word}
.out .c{color:#fff}.out .e{color:var(--bad)}.out .s{color:#6e8b90}.out .h{color:var(--cy)}
.inp{display:flex;align-items:center;padding:8px 14px;border-top:1px solid rgba(111,227,234,.25);font:700 15px/1 var(--m)}
.inp span{color:var(--ok);white-space:pre}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--ok)}
.pad{padding:12px 16px;overflow:auto;font:600 15px/1.4 var(--f)}
.pad h2{margin:0 0 4px;font:700 22px/1.1 var(--f);color:var(--cy);letter-spacing:.06em;text-transform:uppercase}
.pad .k{font:700 11px var(--m);color:var(--rd);letter-spacing:.14em;text-transform:uppercase}
.pad p{color:var(--dim);margin:4px 0 10px}
.pad ol{margin:0 0 8px;padding-left:1.4em}.pad li{margin:4px 0}
.pad li.ok{color:var(--ok)}.pad li.ok::marker{content:'✓ '}
.pad pre{background:#06090c;border:1px solid rgba(111,227,234,.2);color:#cfe;padding:8px 10px;font:500 13px/1.45 var(--m);white-space:pre-wrap;margin:6px 0}
.pad .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pad .row button{border:1px solid var(--cy2);background:var(--cyd);color:var(--cy);padding:6px 12px;cursor:pointer;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;clip-path:var(--cut-s)}
.pad .row button.pri{background:var(--rd);border-color:var(--rd);color:#1a0b0d}
.pad .row button:hover{filter:brightness(1.2)}
.pad .sum{font:700 15px var(--m);margin-top:6px}.pad .sum.ok{color:var(--ok)}
.pad .hint{border-left:3px solid var(--arp);padding:6px 10px;background:rgba(255,198,92,.08);margin:6px 0}
.pad table{border-collapse:collapse;width:100%;font:500 13px var(--m)}
.pad tr.hot td{background:rgba(255,198,92,.22);color:#ffd98a;animation:hotIn .6s ease-out}
@keyframes hotIn{from{background:rgba(255,198,92,.6)}to{background:rgba(255,198,92,.22)}}
.pad .gone{color:var(--bad);font:500 12px var(--m)}
.pad td,.pad th{border-bottom:1px solid rgba(111,227,234,.15);padding:4px 6px;text-align:left;vertical-align:top}
.pad th{color:var(--rd);font-weight:700}
.pad label{display:block;margin:8px 0 3px;font:700 11px var(--m);color:var(--rd);letter-spacing:.12em;text-transform:uppercase}
.pad code{font:500 13px var(--m);color:var(--cy)}
.pad .send div{padding:3px 0}.pad .send .ok{color:var(--ok)}.pad .send .no{color:var(--bad)}.pad .send .exp{color:var(--arp)}
.pad select,.pad .q{width:100%}
.pad select{background:#0d0709;border:1px solid var(--cy2);color:var(--cy);padding:6px;font:500 14px var(--m)}
.pad h1{font:700 26px var(--f);color:var(--cy);margin:0 0 6px;letter-spacing:.08em;text-transform:uppercase}
.pad h3{font:700 16px var(--f);color:var(--rd);margin:14px 0 4px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--rd2)}
.pad .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 22px}
/* трасса пакета */
.trace{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);width:min(820px,92vw);z-index:45;display:none;gap:12px;align-items:flex-start;
  padding:10px 14px;background:var(--panel2);border:1px solid var(--rd);clip-path:var(--cut)}
.trace.on{display:flex}
.trace .ctl{display:flex;gap:4px}
.trace .ctl button{width:34px;height:30px;border:1px solid var(--cy2);background:transparent;color:var(--cy);cursor:pointer;font-weight:700}
.trace .ctl button:hover{background:var(--cy);color:#0e1b1e}
.trace .txt{flex:1;min-width:0}
.trace .n{font:700 11px var(--m);color:var(--rd);letter-spacing:.12em;text-transform:uppercase}
.trace .t{font:600 15px/1.35 var(--f)}
.trace .t.arp{color:var(--arp)}.trace .t.drop{color:var(--bad)}.trace .t.ok{color:var(--ok)}.trace .t.ip{color:var(--cy)}.trace .t.nat{color:var(--nat)}
.trace .notes{font:500 12px var(--m);color:var(--bad);margin-top:3px}
.trace .x{border:0;background:none;color:var(--dim);font-size:20px;cursor:pointer}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--rd);color:#1a0b0d;padding:8px 18px;z-index:9600;font-weight:700;letter-spacing:.06em;
  clip-path:var(--cut-s);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.nano textarea{flex:1;background:#06090c;color:#d8e6e8;border:0;outline:0;padding:10px;font:500 14px/1.45 var(--m);resize:none}
.nano .keys{display:flex;gap:10px;padding:6px 10px;font:600 13px var(--m)}
.nano .keys button{background:var(--cy);color:#0e1b1e;border:0;font:700 13px var(--m);padding:2px 8px;cursor:pointer}
@media (max-width:900px){.stat,.bar,.rule,.dhint{display:none}.side{width:88vw}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i>E</i><div>ELTEX // NETLAB<small>NTF-2 · СЕТЕВАЯ ЛАБОРАТОРИЯ</small></div></div>
  <div class="rule"></div>
  <div class="stat" id="stat"></div>
  <div class="clk t-only" id="clk" title="Модельное время сети: от него стареют записи MAC (300 с) и ARP">
    <span class="ck">ВРЕМЯ СЕТИ</span><b id="clkT">00:00:00</b>
    <span class="cb"><button data-sp="0" title="Пауза">❚❚</button><button data-sp="1" class="on">×1</button><button data-sp="10">×10</button><button data-sp="60">×60</button></span>
    <span class="cb ff"><button data-ff="60" title="Промотать 1 минуту">⏩ 1 мин</button><button data-ff="300" title="Промотать 5 минут — MAC-записи с таймером 300 с истекут">⏩ 5 мин</button></span>
  </div>
  <div class="mode" id="mode" title="Работа — как на оборудовании; Тест — учебные инструменты: таблицы, путь пакета, часы, автопроверка"><button data-m="work" class="on">Работа</button><button data-m="test">Тест</button></div>
  <button class="tbtn" id="bFit" title="Показать всю схему">Вся схема</button>
</header>
<svg id="cv"><g id="world"><g id="gl"></g><g id="gp"></g><g id="gd"></g><g id="pk"></g><line id="ghost" class="ghost" x1="0" y1="0" x2="0" y2="0" style="display:none"/></g></svg>
<div class="frame"></div><div class="ticks"></div>
<div class="edge" id="edge"></div>
<aside class="side" id="side">
  <div class="stabs" id="stabs"><button data-t="dev" class="on">Устройства</button><button data-t="lab">Лабы</button><button data-t="task" class="t-only">Задания</button><button data-t="file" class="t-only">Файл</button><button data-t="help" class="t-only">?</button><button class="spin" id="spin" title="Закрепить панель">⇤</button></div>
  <div class="sbody" id="sbody"></div>
</aside>
<div class="dock">
  <button class="term-btn" id="bTerm" title="Открыть терминал выбранного устройства">▣ Терминал</button>
  <div class="chips" id="chips"></div>
  <div class="dhint"><b>ПКМ</b> по полю — добавить · <b>ПКМ</b> по устройству — меню · <b>2×клик</b> — консоль · <b>колесо</b> — масштаб</div>
</div>
<div class="trace" id="trace">
  <div class="ctl"><button data-t="first" title="К началу">⏮</button><button data-t="prev" title="Шаг назад">◀</button><button data-t="next" title="Шаг вперёд">▶</button><button data-t="play" title="Проиграть всё">⏵</button></div>
  <div class="txt"><div class="n" id="trN"></div><div class="t" id="trT"></div><div class="notes" id="trNotes"></div></div>
  <button class="x" data-t="close" title="Закрыть">×</button>
</div>

<h1>Сетевая лаборатория Eltex</h1>
<p>Лёгкий эмулятор для лабораторных NTF2: коммутаторы <b>MES</b> (свой CLI MES24xx), маршрутизатор <b>ESR</b> (CLI ESR), компьютеры <b>VPC</b> и <b>Debian</b>. Работает в браузере, офлайн, на слабых ПК — без виртуальных машин. Это модель поведения по документации Eltex, а не прошивка устройства.</p>
<div class="cols">
<div><h2>Как работать</h2>
<ol><li>Добавьте устройства из палитры слева, перетащите на место.</li>
<li><b>Кабель</b> → щёлкните устройство → выберите порт → второе устройство → порт.</li>
<li>Щёлкните устройство — справа откроется его консоль. Вкладки над консолью переключают устройства.</li>
<li><b>ping</b> в панели или из консоли — на схеме видно, как идут кадры: ARP-рассылка (жёлтый), ответ, IP-пакет (синий), теги VLAN на кабелях. Внизу — пошаговое объяснение: ◀ ▶ по шагам, ⏵ — заново.</li>
<li><b>Лабораторные</b> — готовые работы со случайным вариантом и проверкой после каждой команды. <b>Задания</b> — случайные задачи на один коммутатор.</li>
<li><b>Сохранить / Открыть</b> — схема со всеми настройками в файл .json.</li></ol>
<p>В консоли: <code>?</code> — что можно ввести дальше, <code>Tab</code> — дописать слово, <code>↑ ↓</code> — история. Сокращения работают: <code>conf t</code>, <code>int gi1/0/1</code>, <code>sh vl</code>.</p></div>
<div><h2>Режимы MES</h2>
<pre>switch&gt;            enable
switch#            configure
switch(config)#    interface gigabitethernet 1/0/1
switch(config-if)# exit / end
switch(config)#    vlan database   → (config-vlan)#
switch(config)#    line console    → (config-line)#
switch(config)#    interface range gi1/0/1-4 → (config-if-range)#</pre>
<h2>Режимы ESR</h2>
<pre>vesr#                 configure
vesr(config)#         interface gigabitethernet 1/0/1  → (config-if-gi)#
vesr(config)#         interface gigabitethernet 1/0/1.10 → (config-if-sub)#
vesr(config)#         username master → (config-user)#
vesr(config)#         do commit   — применить
vesr(config)#         do confirm  — подтвердить</pre>
<p>На ESR изменения <b>не действуют до commit</b>. Пакеты на интерфейс с включённым межсетевым экраном отбрасываются — нужна <code>ip firewall disable</code>.</p></div>
</div>
<h2>Ветки ПО коммутаторов</h2>
<table>
<tr><td>10.x — MES14xx/24xx/3400/37xx</td><td>spanning-tree mode rst · channel-group N mode active|passive|on · set lldp enable</td></tr>
<tr><td>6.x и 4.x — MES23xx/33xx/35xx/53xx/54xx–57xx</td><td>spanning-tree mode rstp · channel-group N mode auto|on · lldp run · port monitor ПОРТ</td></tr>
<tr><td>8.x — MES5448/7048 (FASTPATH)</td><td>(switch) # · порты 1/0/N · vlan database из # · port-channel ИМЯ + addport lag N · vlan participation/tagging/pvid · spanning-tree mst priority 0 N</td></tr>
</table>
<p>Порты: fa 100M, gi 1G, tw 2.5G, te 10G, fo 40G, hu 100G (например te1/0/1). Ветка ПО видна в палитре рядом с моделью.</p>
<h2>Команды MES (коммутатор)</h2>
<table>
<tr><td>hostname SW1</td><td>имя (с пробелами — в кавычках)</td></tr>
<tr><td>username admin1 password P privilege 15</td><td>пользователь</td></tr>
<tr><td>enable password [level N] P</td><td>пароль на вход в #</td></tr>
<tr><td>line console | telnet | ssh</td><td>password, exec-timeout, login authentication, login-attempts, history size</td></tr>
<tr><td>banner motd|login|exec @ текст @</td><td>баннеры с разделителем</td></tr>
<tr><td>vlan database · vlan 10,20 · vlan 10 → name IT</td><td>создание VLAN; <code>no vlan 10</code> — удаление</td></tr>
<tr><td>switchport mode access|trunk|general</td><td>режим порта</td></tr>
<tr><td>switchport access vlan 10</td><td>VLAN доступа; <code>no switchport access vlan</code></td></tr>
<tr><td>switchport trunk allowed vlan add|remove 10,20</td><td>VLAN на транке; <code>switchport trunk native vlan 99</code></td></tr>
<tr><td>switchport general allowed vlan add 10 tagged|untagged · switchport general pvid 10</td><td>режим general</td></tr>
<tr><td>shutdown / no shutdown</td><td>выключить / включить порт или SVI</td></tr>
<tr><td>interface vlan 10 · ip address 10.0.0.1 255.255.255.0</td><td>SVI (также <code>/24</code>)</td></tr>
<tr><td>ip default-gateway A.B.C.D · ip route NET MASK NH</td><td>шлюз и статические маршруты</td></tr>
<tr><td>spanning-tree · spanning-tree mode rst · spanning-tree priority 16384 · show spanning-tree</td><td>RSTP</td></tr>
<tr><td>interface port-channel 1 · channel-group 1 mode active|passive|on · show etherchannel summary</td><td>LACP</td></tr>
<tr><td>monitor session 1 destination interface gi1/0/12 · monitor session 1 source interface gi1/0/1 both · show monitor session 1</td><td>SPAN</td></tr>
<tr><td>ip ssh server · crypto key generate rsa · ip http server</td><td>управление</td></tr>
<tr><td>show running-config | startup-config | vlan | interfaces switchport gi1/0/1 | interfaces status | ip interface | ip route | mac address-table</td><td>просмотр (в конфигурации — через <code>do</code>)</td></tr>
<tr><td>write · copy running-config startup-config · reload · ping A.B.C.D</td><td>сохранение, перезагрузка, проверка</td></tr>
<tr><td>sh ru · sh int st · int gi 1/0/1 · sw mode trunk · conf t · wr</td><td>сокращения как на железе: любое слово сокращается до однозначного начала</td></tr>
<tr><td>10.x: switchport port-security enable · mac-limit N · mode max-addresses|lock|secure-permanent · violation restrict|protect|discard-shutdown · show port-security</td><td>port security: кадры с чужих MAC отбрасываются, discard-shutdown выключает порт</td></tr>
<tr><td>6.x/4.x: port security · port security max N · port security mode lock|max-addresses · port security forward|discard|discard-shutdown · show ports security</td><td>port security в ветке 6.x</td></tr>
<tr><td>spanning-tree portfast · spanning-tree bpduguard enable</td><td>BPDU guard: пришёл BPDU от коммутатора — порт выключается; включить: no shutdown</td></tr>
<tr><td>10.x: mac-address-table static unicast MAC vlan N interface gi1/0/7 status permanent · 6.x: mac address-table static MAC vlan N interface gi1/0/7</td><td>статическая MAC-запись (не стареет)</td></tr>
<tr><td>mac-address-table aging-time N (10.x) · mac address-table aging-time N (6.x) · bridge aging-time N (8.x) · arp timeout N</td><td>таймеры старения</td></tr>
<tr><td>show version · show system · show clock · clock set 10:20:30 5 Mar 2026 · clock timezone MSK +3 · show users</td><td>версия, время</td></tr>
<tr><td>show interfaces description · show running-config interface gi1/0/1 · show lldp neighbors · traceroute A.B.C.D (6.x: traceroute ip A.B.C.D)</td><td>описания портов, конфиг порта, соседи, маршрут</td></tr>
</table>
<h2>Команды ESR (маршрутизатор)</h2>
<table>
<tr><td>hostname R1 · clock timezone gmt +7 · set date 11:25:30 11 November 2025 · show date</td><td>базовые</td></tr>

<script>
/* Симулятор CLI коммутатора Eltex для тренажёров дек «Базовая настройка» и «VLAN».
   Режимы и приглашения как на устройстве: switch# → configure → switch(config)# → interface … → switch(config-if)#.

(function () {
  'use strict';
  var NPORTS = 24;

  // ------------------------------------------------------------------ состояние коммутатора
  function fresh(n) {
    var ports = {};

      ports['gi1/0/' + i] = { mode: 'access', access: 1, allowed: [], native: 1, pvid: 1, gtag: [], guntag: [1] };
    }
    return {
      host: 'switch', mode: 'priv', ctx: null,
      vlans: { 1: '-' }, ports: ports, svi: {}, gw: null, ssh: false, rsa: false, http: true,
      users: {}, enable: {}, banner: { login: null, exec: null, motd: null },

  var PROMPT = { user: '>', priv: '#', config: '(config)#', 'if': '(config-if)#', range: '(config-if-range)#',

  function parseList(s) {           // "10,20,30-40" → [10,20,30..40]
    var out = [];
    String(s).split(',').forEach(function (p) {
      var m = p.match(/^(\d+)-(\d+)$/);
      if (m) { for (var i = +m[1]; i <= +m[2]; i++) out.push(i); }

    });
    return out;
  }
  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }).sort(function (a, b) { return a - b; }); }
  function fmtList(a) {
    a = uniq(a); var r = [], i = 0;
    while (i < a.length) { var j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
      r.push(j > i ? a[i] + '-' + a[j] : '' + a[i]); i = j + 1; }
    return r.join(',');
  }
  // gi1/0/1, gi1/0/1-4, te1/0/1, fo1/0/2; без префикса — порты FASTPATH (MES5448/7048): 1/0/1, 1/0/1-1/0/4
  var PFX = { gi: 'gigabitethernet', te: 'tengigabitethernet', fo: 'fortygigabitethernet', hu: 'hundredgigabitethernet',
              tw: 'twopointfivegigabitethernet', fa: 'fastethernet' };
  function ifList(spec) {
    var m = spec.match(/^(gi|te|fo|hu|tw|fa)?(\d+)\/(\d+)\/(\d+)(?:-(?:(?:gi|te|fo|hu|tw|fa)?\d+\/\d+\/)?(\d+))?$/);
    if (!m || m[2] !== '1' || m[3] !== '0') return null;
    var pf = m[1] || '', a = +m[4], b = m[5] ? +m[5] : a, out = [];
    if (a < 1 || b > 64 || b < a) return null;
    for (var i = a; i <= b; i++) out.push(pf + '1/0/' + i);
    return out;
  }
  function longIf(k) { var m = k.match(/^([a-z]*)(\d.*)$/); return m[1] ? PFX[m[1]] + ' ' + m[2] : m[2]; }
  function portGroups(names) {      // ['gi1/0/1','gi1/0/2','te1/0/1'] → 'gi1/0/1-2, te1/0/1'
    var g = {}, order = [];
    names.forEach(function (k) { var m = k.match(/^(.*\/)(\d+)$/); if (!g[m[1]]) { g[m[1]] = []; order.push(m[1]); } g[m[1]].push(+m[2]); });
    return order.map(function (p) { return p + fmtList(g[p]); }).join(', ');
  }
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    var x = (h >>> 0).toString(16); return (x + x + x + x + x).slice(0, 40); }

  // ------------------------------------------------------------------ команды: шаблоны с префиксами ключевых слов
  // <n> число, <w> слово, <ip> адрес, <if> интерфейс, <list> список VLAN, <rest> остаток строки
  var CMDS = [];
  function cmd(modes, pat, run) { CMDS.push({ modes: modes.split(' '), pat: pat.split(' '), run: run }); }
  var CFG = 'config if range vlan line';

  function match(pat, toks) {
    var args = [], i = 0;
    for (var k = 0; k < pat.length; k++) {
      var p = pat[k], t = toks[i];
      if (p === '<rest>') { if (i >= toks.length) return null; args.push(toks.slice(i).join(' ')); return args; }
      if (t === undefined) return null;
      if (p === '<n>') { if (!/^\d+$/.test(t)) return null; args.push(+t); i++; continue; }
      if (p === '<w>') { args.push(t); i++; continue; }
      if (p === '<ip>') { if (!/^\d+\.\d+\.\d+\.\d+$/.test(t)) return null; args.push(t); i++; continue; }
      if (p === '<if>') { var L = ifList(t); if (!L) return null; args.push(L); i++; continue; }
      if (p === '<list>') { if (!/^[\d,\-]+$/.test(t)) return null; args.push(parseList(t)); i++; continue; }
      if (p === '<mask>') {           // /24, 24 или 255.255.255.0
        var mm = t.match(/^\/?(\d{1,2})$/);
        if (mm) { args.push(+mm[1]); i++; continue; }
        if (/^\d+\.\d+\.\d+\.\d+$/.test(t)) { args.push(t.split('.').reduce(function (a, o) {
          return a + (+o).toString(2).replace(/0/g, '').length; }, 0)); i++; continue; }
        return null;
      }
      // ключевое слово: точное совпадение или префикс от 2 символов
      if (t === p || (t.length >= 2 && p.indexOf(t) === 0) || (p === 'terminal' && t === 't')) { i++; continue; }
      return null;
    }
    return i === toks.length ? args : null;
  }

  // --- режимы
  cmd('priv', 'configure', function (st) { st.mode = 'config'; });
  cmd('priv', 'configure terminal', function (st) { st.mode = 'config'; });
  cmd(CFG, 'exit', function (st) { st.mode = st.mode === 'config' ? 'priv' : 'config'; st.ctx = null; });
  cmd(CFG, 'end', function (st) { st.mode = 'priv'; st.ctx = null; });
  cmd('priv', 'exit', function () { return '% Сессия остаётся открытой (тренажёр)'; });

  // --- базовая настройка
  cmd('config', 'hostname <rest>', function (st, a) {
    var h = a[0].replace(/^"(.*)"$/, '$1');
    if (/\s/.test(h) && !/^".*"$/.test(a[0])) return '% Имя с пробелом нужно указывать в кавычках';

  cmd('config', 'no hostname', function (st) { st.host = 'switch'; });
  cmd('config', 'username <w> password <w> privilege <n>', function (st, a) {

  cmd('config', 'no username <w>', function (st, a) {
    if (!st.users[a[0]]) return '% Пользователь не найден'; delete st.users[a[0]]; });
  cmd('config', 'enable password level <n> <w>', function (st, a) { st.enable[a[0]] = a[1]; });
  cmd('config', 'enable password <w>', function (st, a) { st.enable[15] = a[0]; });
  cmd('config', 'line console', function (st) { st.mode = 'line'; st.ctx = 'console'; });
  cmd('config', 'line ssh', function (st) { st.mode = 'line'; st.ctx = 'ssh'; });
  cmd('config', 'line telnet', function (st) { st.mode = 'line'; st.ctx = 'telnet'; if (!st.line.telnet) st.line.telnet = {}; });
  cmd('line', 'password <w>', function (st, a) { st.line[st.ctx].pw = a[0]; });
  cmd('line', 'exec-timeout <n>', function (st, a) { st.line[st.ctx].timeout = a[0]; });
  cmd('line', 'login authentication <w>', function (st, a) { st.line[st.ctx].auth = a[0]; });
  cmd('line', 'login-attempts <n>', function (st, a) { st.line[st.ctx].attempts = a[0]; });
  cmd('line', 'history size <n>', function (st, a) { st.line[st.ctx].history = a[0]; });
  cmd('config', 'aaa authentication login <w> <rest>', function (st, a) { st.aaa = a[0] + ' ' + a[1]; });
  cmd('config', 'ip ssh server', function (st) { st.ssh = true; });
  cmd('config', 'no ip ssh server', function (st) { st.ssh = false; });
  cmd('config', 'crypto key generate rsa', function (st) {
    st.rsa = true; return 'Replace Existing (Default) RSA Key ? (Y/N)[N] Y\nThe SSH Server is generating a RSA key. This may take a few minutes, depending on the key size.'; });
  cmd('config', 'ip http server', function (st) { st.http = true; });
  cmd('config', 'no ip http server', function (st) { st.http = false; });
  cmd('config', 'ip default-gateway <ip>', function (st, a) { st.gw = a[0]; });
  cmd('config', 'interface vlan <n>', function (st, a) { st.mode = 'if'; st.ctx = { svi: a[0] }; });
  cmd('if', 'ip address <ip> <mask>', function (st, a) {
    if (!st.ctx || !st.ctx.svi) return '% Команда доступна на интерфейсе VLAN';
    st.svi[st.ctx.svi] = a[0] + '/' + a[1]; });

  // --- VLAN
  cmd('config', 'vlan <n> name <w>', function (st, a) { if (a[0] < 2 || a[0] > 4094) return '% VLAN 1 и 4095 зарезервированы';
    st.vlans[a[0]] = a[1]; });
  cmd('config vlan', 'vlan <n>', function (st, a) { if (a[0] < 2 || a[0] > 4094) return '% VLAN 1 и 4095 зарезервированы';
    if (!st.vlans[a[0]]) st.vlans[a[0]] = '-'; st.mode = 'vlan'; st.ctx = a[0]; });
  cmd('vlan', 'name <w>', function (st, a) { st.vlans[st.ctx] = a[0]; });
  cmd('config', 'no vlan <n>', function (st, a) {
    if (a[0] === 1) return '% VLAN 1 удалить нельзя'; if (!st.vlans[a[0]]) return '% VLAN не существует';
    delete st.vlans[a[0]];
    Object.keys(st.ports).forEach(function (k) { if (st.ports[k].access === a[0]) st.ports[k].access = 1; });
  });
  cmd('config', 'interface <if>', function (st, a) {
    if (a[0].length > 1) return '% Для нескольких портов используйте interface range';
    if (!st.ports[a[0][0]]) return '% Такого порта нет на устройстве';
    st.mode = 'if'; st.ctx = { ports: a[0] }; });
  cmd('config', 'interface range <if>', function (st, a) { st.mode = 'range'; st.ctx = { ports: a[0] }; });
  function eachPort(st, f) {
    if (!st.ctx || !st.ctx.ports) return '% Команда доступна в настройке физического порта';
    if (st.ctx.ports.some(function (k) { return !st.ports[k] && !(st.pos && st.pos[k]); })) return '% Такого порта нет на устройстве';
    st.ctx.ports.forEach(function (k) { f(st.ports[k] || st.pos[k]); });
  }
  var IFM = 'if range';
  cmd(IFM, 'switchport mode access', function (st) { return eachPort(st, function (p) { p.mode = 'access'; }); });
  cmd(IFM, 'switchport mode trunk', function (st) { return eachPort(st, function (p) { p.mode = 'trunk'; }); });
  cmd(IFM, 'switchport mode general', function (st) { return eachPort(st, function (p) { p.mode = 'general'; }); });
  cmd(IFM, 'switchport access vlan <n>', function (st, a) {
    if (!st.vlans[a[0]]) return '% VLAN ' + a[0] + ' не создана';
    return eachPort(st, function (p) { p.access = a[0]; }); });
  cmd(IFM, 'no switchport access vlan', function (st) { return eachPort(st, function (p) { p.access = 1; }); });
  cmd(IFM, 'switchport trunk allowed vlan add <list>', function (st, a) {
    var bad = a[0].filter(function (v) { return !st.vlans[v]; });
    if (bad.length) return '% VLAN ' + fmtList(bad) + ' не созданы';
    return eachPort(st, function (p) { p.allowed = uniq(p.allowed.concat(a[0])); }); });
  cmd(IFM, 'switchport trunk allowed vlan remove <list>', function (st, a) {
    return eachPort(st, function (p) { p.allowed = p.allowed.filter(function (v) { return a[0].indexOf(v) < 0; }); }); });
  cmd(IFM, 'switchport trunk native vlan <n>', function (st, a) {
    if (!st.vlans[a[0]]) return '% VLAN ' + a[0] + ' не создана';
    return eachPort(st, function (p) { p.native = a[0]; }); });
  cmd(IFM, 'switchport general pvid <n>', function (st, a) {
    if (!st.vlans[a[0]]) return '% VLAN ' + a[0] + ' не создана';
    return eachPort(st, function (p) { p.pvid = a[0]; }); });
  cmd(IFM, 'switchport general allowed vlan add <list> tagged', function (st, a) {
    var bad = a[0].filter(function (v) { return !st.vlans[v]; }); if (bad.length) return '% VLAN ' + fmtList(bad) + ' не созданы';
    return eachPort(st, function (p) { p.gtag = uniq(p.gtag.concat(a[0])); p.guntag = p.guntag.filter(function (v) { return a[0].indexOf(v) < 0; }); }); });
  cmd(IFM, 'switchport general allowed vlan add <list> untagged', function (st, a) {
    var bad = a[0].filter(function (v) { return !st.vlans[v]; }); if (bad.length) return '% VLAN ' + fmtList(bad) + ' не созданы';
    return eachPort(st, function (p) { p.guntag = uniq(p.guntag.concat(a[0])); p.gtag = p.gtag.filter(function (v) { return a[0].indexOf(v) < 0; }); }); });

  // --- show
  var RUNX = [], PORTX = [];                  // PORTX: доп. строки внутри блока interface                              // доп. строки running-config от модулей эмулятора
  function showRun(st) {
    var o = [];
    var vl = Object.keys(st.vlans).map(Number).filter(function (v) { return v !== 1; });
    if (vl.length) { o.push('vlan database', ' vlan ' + fmtList(vl));
      vl.forEach(function (v) { if (st.vlans[v] !== '-') o.push(' vlan ' + v + ' name ' + st.vlans[v]); }); o.push('exit', '!'); }
    if (st.host !== 'switch') o.push('hostname ' + (/\s/.test(st.host) ? '"' + st.host + '"' : st.host), '!');
    Object.keys(st.users).forEach(function (u) { o.push('username ' + u + ' password encrypted ' + hash(st.users[u].pw) + ' privilege ' + st.users[u].priv); });
    Object.keys(st.enable).forEach(function (l) { o.push('enable password ' + (l == 15 ? '' : 'level ' + l + ' ') + 'encrypted ' + hash(st.enable[l])); });
    if (Object.keys(st.users).length) o.push('!');
    if (st.banner.motd) o.push('banner motd ^', st.banner.motd, '^');
    if (st.banner.login) o.push('banner login ^', st.banner.login, '^');
    if (st.banner.exec) o.push('banner exec ^', st.banner.exec, '^');

    $('trN').textContent = trace.title + ' · шаг ' + (trace.i + 1) + '/' + trace.steps.length + (trace.i === trace.steps.length - 1 ? (trace.ok ? ' · ДОСТАВЛЕНО' : ' · НЕ ДОСТАВЛЕНО') : '');
    $('trT').className = 't ' + cls; $('trT').textContent = s.t;
    $('trNotes').textContent = (s.notes || []).length && (s.k === 'drop' || s.k === 'arp') ? 'Отброшено по пути: ' + s.notes.join('; ') : '';
    refreshTables();
    return anim && s.segs ? animSegs(s.segs, s.k === 'arp', { arp: '#ffc65c', arpr: '#ffc65c', ip: '#6fe3ea' }[s.k] || '#7dffb0') : 0;
  }
  function depth(segs, i) { var d = 0, cur = segs[i];
    for (var g = 0; g < 20; g++) { var par = segs.slice(0, segs.indexOf(cur)).filter(function (s) { return s.to === cur.from; }).pop(); if (!par) break; d++; cur = par; } return d; }
  function animSegs(segs, flood, color) {
    var g = $('pk'); g.innerHTML = ''; var dur = 650, gap = flood ? 160 : dur, total = 0;
    segs.forEach(function (sg, i) {
      var a0 = net.devs[sg.from], b0 = net.devs[sg.to]; if (!a0 || !b0) return;
      var of = net.links[sg.li] ? linkOff(sg.li) : { x: 0, y: 0 }, a = { x: a0.x + of.x, y: a0.y + of.y }, b = { x: b0.x + of.x, y: b0.y + of.y };
      var t0 = (flood ? depth(segs, i) : i) * gap; total = Math.max(total, t0 + dur);
      var dot = el('g', { 'class': 'pkt', opacity: 0 }, g); el('path', { d: 'M-9 -6h18v12h-18z', fill: color }, dot);
      if (sg.tag !== null) el('text', { x: 12, y: -10 }, dot).textContent = 'VLAN ' + sg.tag;
      var st = performance.now() + t0;
      (function step(now) { var k = (now - st) / dur;
        if (k < 0) { requestAnimationFrame(step); return; } if (k > 1) { dot.setAttribute('opacity', .3); return; }
        dot.setAttribute('opacity', 1); dot.setAttribute('transform', 'translate(' + (a.x + (b.x - a.x) * k) + ',' + (a.y + (b.y - a.y) * k) + ')');
        requestAnimationFrame(step); })(performance.now());
    });
    return total;
  }
  function play() { if (!trace) return; var dur = renderStep(true);
    if (trace.i < trace.steps.length - 1) trace.timer = setTimeout(function () { trace.i++; play(); }, Math.max(dur, 900) + 500); }
  $('trace').addEventListener('click', function (e) {
    var b = e.target.closest('[data-t]'); if (!b || !trace) return; var a = b.dataset.t; stopTrace();
    if (a === 'close') { $('trace').classList.remove('on'); trace = null; refreshTables(); return; }
    if (a === 'first') trace.i = 0; if (a === 'prev') trace.i = Math.max(0, trace.i - 1);
    if (a === 'next') trace.i = Math.min(trace.steps.length - 1, trace.i + 1);
    if (a === 'play') { trace.i = 0; play(); return; } renderStep(true);
  });

  // ================================================================== левая панель
  var tab = 'dev';
  $('edge').addEventListener('mouseenter', function () { $('side').classList.add('open'); });
  $('edge').addEventListener('click', function () { $('side').classList.toggle('open'); });
  $('side').addEventListener('mouseleave', function () { $('side').classList.remove('open'); });
  $('spin').addEventListener('click', function () { var p = $('side').classList.toggle('pin'); this.classList.toggle('on', p); });
  $('stabs').addEventListener('click', function (e) { var b = e.target.closest('[data-t]'); if (!b) return;
    if (b.dataset.t === 'help') { openHelp(); return; }
    tab = b.dataset.t; [].forEach.call(this.querySelectorAll('[data-t]'), function (x) { x.classList.toggle('on', x === b); }); renderSide(); });
  function renderSide() {
    var s = $('sbody'), h = '';
    if (tab === 'dev') {
      h = '<input class="q" id="sq" placeholder="Поиск модели…">';
      catalogGroups().forEach(function (g) {
        h += '<h4>' + esc(g.name) + '</h4>' + g.items.map(function (k) { var m = EL.MODELS[k];
          return '<button class="pi" draggable="true" data-model="' + k + '" title="' + esc(m.full || m.note) + '">' + iconSvg(m.type, k) +
            '<span><b>' + k + (m.sw ? '<span class="sw">' + m.sw.replace('ПО ', '') + '</span>' : '') + '</b><small>' + esc(m.note) + '</small></span></button>'; }).join('');
      });
      h += '<p class="note">Перетащите модель на поле или щёлкните — появится в центре. ПКМ по пустому полю — то же с поиском. ' +
           'Коммутаторы: CLI по ветке ПО (10.x · 6.x/4.x · 8.x FASTPATH), порты как на устройстве. Это модель по документации Eltex, не прошивка.</p>';
    }
    if (tab === 'lab') {
      if (lab) h = '<button class="act" data-s="labwin">Окно задания ' + lab.id + '</button>';
      h += '<h4>Лабораторные NTF-2</h4>' + EL.labs.LABS.map(function (L) { return '<button class="lbtn" data-lab="' + L.id + '"><b>' + L.id + '</b>' + esc(L.title) + '</button>'; }).join('');
    }
    if (tab === 'task') h = '<h4>Случайное задание на коммутатор</h4><p class="note">Как тренажёры дек «Базовая настройка» и «VLAN»: проверяется итоговое состояние.</p>' +
      '<button class="act" data-s="tbase">Базовая настройка</button><button class="act" data-s="tvlan">VLAN</button>';
    if (tab === 'file') h = '<h4>Схема</h4><button class="act" data-s="save">Сохранить в файл</button><button class="act" data-s="open">Открыть файл</button>' +
      '<button class="act" data-s="fit">Показать всю схему</button><button class="act red" data-s="clear">Очистить</button>' +
      '<p class="note">Файл .json хранит устройства, кабели и все настройки. В браузере ничего не сохраняется само.</p>';
    s.innerHTML = h;
    var q = $('sq'); if (q) q.addEventListener('input', function () { var v = q.value.trim().toLowerCase();
      [].forEach.call(s.querySelectorAll('.pi'), function (b) { b.style.display = !v || b.textContent.toLowerCase().indexOf(v) >= 0 ? '' : 'none'; }); });
  }
  $('sbody').addEventListener('dragstart', function (e) { var b = e.target.closest('[data-model]'); if (b) e.dataTransfer.setData('text/model', b.dataset.model); });
  $('sbody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-model],[data-lab],[data-s]'); if (!b) return;
    if (b.dataset.model) { var r = cv.getBoundingClientRect(), p = toWorld(r.left + r.width / 2 + (Math.random() - .5) * 160, r.top + r.height / 2 + (Math.random() - .5) * 120); addDev(b.dataset.model, p.x, p.y); return; }
    if (b.dataset.lab) { startLab(b.dataset.lab); return; }
    var a = b.dataset.s;
    if (a === 'labwin') renderLab(true);
    if (a === 'tbase' || a === 'tvlan') startTask(a.slice(1));
    if (a === 'save') save(); if (a === 'open') $('fOpen').click(); if (a === 'fit') fit(); if (a === 'clear') clearAll();
  });

  // ================================================================== лабы и задания
  function resetNet() {
    stopTrace(); $('trace').classList.remove('on');
    Object.keys(wins).forEach(function (k) { closeWin(k, true); }); chips();
    net = new EL.Net(); net.onTrace = function (r, id, dst) { showTrace(r, id, dst); }; terms = {}; sel = null; selLink = null; cable = null; draw();
  }
  function startLab(id) {
    lab = EL.labs.byId(id); labP = lab.gen(); labShow = false; task = null; resetNet(); lab.build(net, labP); draw(); fit(); renderLab(true); renderSide();
  }
  function renderLab(open) {
    if (!lab) return;
    var body = $('labbody');
    if (!wins.lab) { if (!open) return; body = document.createElement('div'); body.className = 'pad'; body.id = 'labbody';
      makeWin('lab', 'Задание ' + lab.id, lab.title, body, { x: 30, y: 80, w: 470, h: Math.min(620, innerHeight - 160) });
      body.addEventListener('click', labClick); }
    else if (open) minWin('lab', false);
    var ts = lab.tasks(labP), ok = 0;
    if (mode === 'work') {   // как методичка: текст задания, без проверки и подсказок
      body.innerHTML = '<div class="k">Лабораторная ' + lab.id + '</div><h2>' + esc(lab.title) + '</h2><p>' + esc(lab.goal) + '</p><ol>' +
        ts.map(function (t) { return '<li>' + t.t + '</li>'; }).join('') + '</ol>';
      return;
    }
    var li = ts.map(function (t) { var y = false; try { y = !!t.ok(net); } catch (e) { y = false; } if (y) ok++; return '<li class="' + (y ? 'ok' : '') + '">' + t.t + '</li>'; }).join('');
    var sol = '';
    if (labShow === true) { var s = lab.sol(labP); sol = Object.keys(s).map(function (n) { return '<b>' + esc(n) + '</b><pre>' + esc(s[n].join('\n')) + '</pre>'; }).join('') + (lab.alt ? '<p>' + esc(lab.alt) + '</p>' : ''); }
    body.innerHTML = '<div class="k">Лабораторная ' + lab.id + '</div><h2>' + esc(lab.title) + '</h2><p>' + esc(lab.goal) + '</p><ol>' + li + '</ol>' +
      '<div class="sum ' + (ok === ts.length ? 'ok' : '') + '">' + (ok === ts.length ? 'РАБОТА ВЫПОЛНЕНА ✓' : 'Выполнено ' + ok + ' из ' + ts.length) + '</div>' +
      (lab.hint && labShow === 'hint' ? '<div class="hint">' + esc(lab.hint(labP)) + '</div>' : '') +
      '<div class="row"><button data-a="new" class="pri">Новый вариант</button>' + (lab.hint ? '<button data-a="hint">Подсказка</button>' : '') +
      '<button data-a="sol">' + (labShow === true ? 'Скрыть решение' : 'Решение') + '</button></div>' + sol;
  }
  function labClick(e) { var b = e.target.closest('[data-a]'); if (!b) return; var a = b.dataset.a;
    if (a === 'new') startLab(lab.id); if (a === 'sol') { labShow = labShow === true ? false : true; renderLab(); } if (a === 'hint') { labShow = 'hint'; renderLab(); } }
  function startTask(kind) {
    lab = null; resetNet(); var d = net.add('MES2428', 'SW1', 500, 300); d.st.mode = 'priv'; d.st.host = 'switch';
    task = EL.labs.randomTask(kind); task.kind = kind; task.dev = d.id; if (task.T.setup) task.T.setup(task.P, d.st);
    task.html = task.T.text(task.P); task.res = ''; task.sol = false; term(d.id).auth = true; draw(); fit(); renderTask(true); openTerm(d.id);
  }
  function renderTask(open) {
    if (!task) return; var body = $('taskbody');
    if (!wins.task) { if (!open) return; body = document.createElement('div'); body.className = 'pad'; body.id = 'taskbody';
      makeWin('task', 'Задание', task.kind === 'base' ? 'базовая настройка' : 'VLAN', body, { x: 30, y: 80, w: 440, h: 420 }); body.addEventListener('click', taskClick); }
    var T = task.T;
    body.innerHTML = '<div class="k">Задание · ' + (task.kind === 'base' ? 'базовая настройка' : 'VLAN') + '</div><p style="color:var(--ink)">' + task.html + '</p>' +
      '<div class="row"><button data-a="check" class="pri">Проверить</button>' + (T.send ? '<button data-a="send">Отправить кадр</button>' : '') +
      '<button data-a="other">Другое</button><button data-a="sol">Решение</button></div>' + task.res + (task.sol ? '<pre>' + esc(T.sol(task.P).join('\n')) + '</pre>' : '');
  }
  function taskClick(e) { var b = e.target.closest('[data-a]'); if (!b) return; var a = b.dataset.a, st = net.devs[task.dev].st;
    if (a === 'other') { startTask(task.kind); return; } if (a === 'sol') task.sol = !task.sol;
    if (a === 'check') { var cs = task.T.checks(task.P), ok = 0;
      task.res = '<div class="send">' + cs.map(function (c) { var y = !!c[1](st); if (y) ok++; return '<div class="' + (y ? 'ok' : 'no') + '">' + (y ? '✓ ' : '✗ ') + c[0] + '</div>'; }).join('') +
        '</div><div class="sum ' + (ok === cs.length ? 'ok' : '') + '">' + (ok === cs.length ? 'ВЫПОЛНЕНО ✓' : ok + ' из ' + cs.length) + '</div>'; }
    if (a === 'send') { var r = task.T.send(task.P, st); task.res = '<div class="send">' + r.map(function (x) { return '<div class="' + (x.ok ? 'ok' : x.exp ? 'exp' : 'no') + '">✉ ' + esc(x.t) + '</div>'; }).join('') + '</div>'; }
    renderTask(); }
  function refresh() { renderLab(false); refreshTables(); }

  // ================================================================== справка, файл, клавиши
  function openHelp() {
    var body = document.createElement('div'); body.className = 'pad'; var src = document.getElementById('helpSrc');
    body.innerHTML = src ? src.innerHTML : ''; var c = body.querySelector('.close'); if (c) c.remove();
    makeWin('help', 'Справка', 'команды и управление', body, { x: 60, y: 70, w: Math.min(980, innerWidth - 120), h: innerHeight - 150 });
  }
  function save() {
    var blob = new Blob([JSON.stringify(net.toJSON(), null, 1)], { type: 'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'eltex-shema.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  $('fOpen').addEventListener('change', function () { var f = this.files[0]; if (!f) return; var rd = new FileReader();
    rd.onload = function () { try { var n = EL.Net.fromJSON(JSON.parse(rd.result)); lab = null; task = null; resetNet(); net = n; net.onTrace = function (r, id, dst) { showTrace(r, id, dst); };
        draw(); fit(); toast('Схема загружена: ' + net.list().length + ' устройств'); } catch (err) { toast('Не удалось открыть: ' + err.message); } };
    rd.readAsText(f); this.value = ''; });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.key === 'Escape') { closeMenu(); if (cable) { cable = null; $('ghost').style.display = 'none'; draw(); } }
    if (e.key === 'Delete') { if (selLink !== null) { net.disconnect(selLink); selLink = null; draw(); refresh(); } else if (sel) delDev(sel); }
  });
  var tt = null;
  function toast(t) { var x = $('toast'); x.textContent = t; x.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { x.classList.remove('on'); }, 2600); }

  // ================================================================== старт
  renderSide();
  (function demo() {
    var s = net.add('MES2428', 'SW1', 500, 330), r = net.add('vESR', 'R1', 500, 130), a = net.add('VPC', 'VPC1', 260, 500), b = net.add('VPC', 'VPC2', 740, 500);
    net.connect(s.id, 'gi1/0/24', r.id, 'gi1/0/1'); net.connect(a.id, 'eth0', s.id, 'gi1/0/1'); net.connect(b.id, 'eth0', s.id, 'gi1/0/2');
    draw(); setTimeout(fit, 30);
  })();
  window.addEventListener('resize', applyView);
  window.ELUI = { net: function () { return net; }, run: function (id, l) { run(id, l); }, startLab: startLab, openTerm: openTerm, toWorld: toWorld };
})();

</script>
