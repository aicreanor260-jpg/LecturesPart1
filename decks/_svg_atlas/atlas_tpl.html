<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Атлас SVG · все лекции</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700&family=Nunito+Sans:wght@400;700;900&family=Fredoka:wght@500;600;700&family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0a14;--panel:#16132a;--panel-2:#1e1a36;--line:rgba(168,85,247,.18);
  --pink:#ff3c78;--purple:#a855f7;--white:#f0eaf8;--muted:#8b7faa;
  --r:14px;
}
body{background:var(--bg);color:var(--white);font-family:Inter,'Segoe UI',system-ui,sans-serif;min-height:100vh}
header{padding:clamp(20px,4vw,48px) clamp(16px,4vw,48px) 12px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between}
h1{font-size:clamp(28px,5vw,56px);font-weight:800;letter-spacing:-.02em;line-height:1}
h1 span{background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{color:var(--muted);font-size:15px;margin-top:10px}
.sub b{color:var(--white)}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{all:unset;cursor:pointer;padding:10px 20px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected=true]{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}
.tabs button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
nav{position:sticky;top:0;z-index:5;background:rgba(12,10,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px clamp(16px,4vw,48px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
nav a{flex:none;text-decoration:none;color:var(--white);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap;transition:border-color .2s,background .2s}
nav a:hover,nav a:focus-visible{border-color:var(--pink);background:var(--panel-2);outline:none}
nav a small{color:var(--pink);font-weight:700;margin-left:6px}
.search{margin:0 clamp(16px,4vw,48px);padding-top:16px}
.search input{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--white);padding:11px 14px;font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--pink)}
main{padding:8px clamp(16px,4vw,48px) 80px}
section.grp{padding-top:36px;scroll-margin-top:64px}
.gh{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}
.gh .ch{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--pink)}
.gh h2{font-size:clamp(20px,3vw,30px);font-weight:700;letter-spacing:-.01em}
.gh .n{margin-left:auto;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;grid-auto-flow:dense}
.card.wide .view{height:240px}
.ich{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 0 10px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.ico{border:1px solid var(--line);border-radius:10px;height:92px;padding:10px;cursor:zoom-in;transition:border-color .2s,transform .2s}
.ico:hover,.ico:focus-visible{border-color:var(--pink);transform:translateY(-2px);outline:none}
.ico .host{width:100%;height:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,60,120,.6)}
.card.wide{grid-column:span 2}
@media (max-width:760px){.card.wide{grid-column:auto}}
.view{height:240px;display:flex;align-items:center;justify-content:center;padding:10px;cursor:zoom-in;position:relative}
.view .host{width:100%;height:100%}
.meta{padding:10px 12px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
.meta .t{flex:1;min-width:0;font-size:13px;line-height:1.35}
.meta .t b{color:var(--pink);font-weight:700}
.meta .t span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{all:unset;cursor:pointer;flex:none;font-size:12px;font-weight:600;padding:7px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--white);transition:border-color .2s,background .2s}
.btn:hover,.btn:focus-visible{border-color:var(--pink);background:rgba(255,60,120,.12)}
.tags{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 10px}
.tags i{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.empty{color:var(--muted);padding:12px 0}
dialog{border:none;background:transparent;max-width:96vw;max-height:94vh;margin:auto;padding:0}
dialog::backdrop{background:rgba(6,4,12,.88)}
.lb{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;max-height:94vh}
.lb .stage{padding:16px;overflow:auto;display:flex;justify-content:center}
.lb .stage .host{width:min(92vw,1400px);height:min(76vh,800px)}
.lb .bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.lb .bar .t{flex:1;font-size:14px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Атлас <span>SVG</span></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-lect" aria-selected="true">По лекциям</button>
    <button role="tab" id="tab-top" aria-selected="false">По темам</button>
  </div>
</header>
<nav id="nav" aria-label="Разделы"></nav>
<div class="search"><input id="q" type="search" placeholder="Фильтр по названию слайда или тексту на схеме…" aria-label="Фильтр"></div>
<main id="main"></main>
<dialog id="dlg"><div class="lb"><div class="stage"><div class="host" id="lbHost"></div></div>
  <div class="bar"><div class="t" id="lbT"></div><button class="btn" id="lbDl">Скачать .svg</button><button class="btn" id="lbX">Закрыть</button></div></div></dialog>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var TOPIC = {}; D.tops.forEach(function(t){ TOPIC[t.id] = t.title; });
  var mode = 'lect', query = '';
  var main = document.getElementById('main'), nav = document.getElementById('nav');
  document.getElementById('sub').innerHTML = '<b>' + D.items.length + '</b> схем из <b>' + D.lect.length + '</b> лекций · клик — увеличить, кнопка — скачать отдельный файл';

  function mount(host, it){
    var root = host.shadowRoot || host.attachShadow({mode:'open'});
    root.innerHTML = '<style>:host{display:block}svg{width:100%;height:100%;display:block}</style>' + it.s;
    var svg = root.querySelector('svg');
    if (svg) { svg.removeAttribute('width'); svg.removeAttribute('height'); svg.setAttribute('preserveAspectRatio','xMidYMid meet'); }
  }
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if (e.isIntersecting) { var h = e.target; io.unobserve(h); mount(h, D.items[+h.dataset.i]); } });
  }, {rootMargin:'600px'});

  function fname(it){ return (it.d + '_slide' + it.sl[0] + '_' + (it.t || 'svg')).replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,90) + '.svg'; }
  function download(i){
    var it = D.items[i], tmp = document.createElement('div');
    tmp.innerHTML = it.s; var svg = tmp.querySelector('svg');
    svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
    if (!svg.getAttribute('style') || svg.getAttribute('style').indexOf('background') < 0) svg.setAttribute('style', (svg.getAttribute('style')||'') + 'background:' + it.bg + ';');
    var xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([xml], {type:'image/svg+xml'}));
    a.download = fname(it); document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function label(it){ return it.c + ' · слайд ' + it.sl.join(', '); }
  function matches(it){
    if (!query) return true;
    var tmp = (it.t + ' ' + it.c + ' ' + it.s.replace(/<[^>]+>/g,' ')).toLowerCase();
    return tmp.indexOf(query) >= 0;
  }
  function card(i){
    var it = D.items[i], el = document.createElement('article');
    el.className = 'card' + (it.w / Math.max(it.h,1) > 2.6 ? ' wide' : '');
    var v = document.createElement('div'); v.className = 'view'; v.style.background = it.bg;
    v.tabIndex = 0; v.setAttribute('role','button'); v.setAttribute('aria-label','Увеличить: ' + (it.t || label(it)));
    var h = document.createElement('div'); h.className = 'host'; h.dataset.i = i; v.appendChild(h); io.observe(h);
    v.onclick = function(){ openLb(i); }; v.onkeydown = function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(i); } };
    var m = document.createElement('div'); m.className = 'meta';
    var t = document.createElement('div'); t.className = 't';
    var b = document.createElement('b'); b.textContent = label(it); var s = document.createElement('span'); s.textContent = it.t || '—';
    t.appendChild(b); t.appendChild(s);
    var bt = document.createElement('button'); bt.className = 'btn'; bt.textContent = '.svg ↓'; bt.title = 'Скачать'; bt.onclick = function(){ download(i); };
    m.appendChild(t); m.appendChild(bt);
    el.appendChild(v); el.appendChild(m);
    var tags = document.createElement('div'); tags.className = 'tags';
    var list = mode === 'lect' ? it.tp.map(function(k){ return TOPIC[k]; }) : [];
    list.forEach(function(x){ var e = document.createElement('i'); e.textContent = x; tags.appendChild(e); });
    if (list.length) el.appendChild(tags);
    return el;
  }
  function icon(i){
    var it = D.items[i], v = document.createElement('div'); v.className = 'ico'; v.style.background = it.bg;
    v.tabIndex = 0; v.setAttribute('role','button'); v.title = label(it) + ' — ' + (it.t || '');
    var h = document.createElement('div'); h.className = 'host'; h.dataset.i = i; v.appendChild(h); io.observe(h);
    v.onclick = function(){ openLb(i); }; v.onkeydown = function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(i); } };
    return v;
  }
  function render(){
    main.innerHTML = ''; nav.innerHTML = '';
    var groups = mode === 'lect' ? D.lect : D.tops;
    groups.forEach(function(g){
      var ids = g.items.filter(function(i){ return matches(D.items[i]); });
      var sec = document.createElement('section'); sec.className = 'grp'; sec.id = 'g-' + g.id;
      var gh = document.createElement('div'); gh.className = 'gh';
      if (g.chap) { var c = document.createElement('span'); c.className = 'ch'; c.textContent = g.chap; gh.appendChild(c); }
      var h2 = document.createElement('h2'); h2.textContent = g.title; gh.appendChild(h2);
      var n = document.createElement('span'); n.className = 'n'; n.textContent = ids.length + ' шт.'; gh.appendChild(n);
      sec.appendChild(gh);
      var grid = document.createElement('div'); grid.className = 'grid';
      var big = ids.filter(function(i){ return !D.items[i].ic; }), sm = ids.filter(function(i){ return D.items[i].ic; });
      big.forEach(function(i){ grid.appendChild(card(i)); });
      sec.appendChild(grid);
      if (sm.length) {
        var ih = document.createElement('p'); ih.className = 'ich'; ih.textContent = 'Иконки и мелкие элементы · ' + sm.length; sec.appendChild(ih);
        var ig = document.createElement('div'); ig.className = 'icons';
        sm.forEach(function(i){ ig.appendChild(icon(i)); }); sec.appendChild(ig);
      }
      if (!ids.length) { var e = document.createElement('p'); e.className = 'empty'; e.textContent = 'Нет схем'; sec.appendChild(e); }
      main.appendChild(sec);
      var a = document.createElement('a'); a.href = '#g-' + g.id;
      a.textContent = g.chap ? g.chap : g.title;
      var sm = document.createElement('small'); sm.textContent = ids.length; a.appendChild(sm);
      nav.appendChild(a);
    });
  }
  var dlg = document.getElementById('dlg'), cur = -1;
  function openLb(i){ cur = i; var it = D.items[i];
    var h = document.getElementById('lbHost'); h.parentNode.style.background = it.bg; mount(h, it);
    document.getElementById('lbT').textContent = label(it) + ' — ' + (it.t || '');
    dlg.showModal(); }
  document.getElementById('lbX').onclick = function(){ dlg.close(); };
  document.getElementById('lbDl').onclick = function(){ download(cur); };
  dlg.addEventListener('click', function(e){ if (e.target === dlg) dlg.close(); });
  function setMode(m){ mode = m;
    document.getElementById('tab-lect').setAttribute('aria-selected', m === 'lect');
    document.getElementById('tab-top').setAttribute('aria-selected', m === 'top');
    render(); scrollTo(0,0); }
  document.getElementById('tab-lect').onclick = function(){ setMode('lect'); };
  document.getElementById('tab-top').onclick = function(){ setMode('top'); };
  var qt; document.getElementById('q').oninput = function(e){ clearTimeout(qt); qt = setTimeout(function(){ query = e.target.value.trim().toLowerCase(); render(); }, 200); };
  render();
})();
</script>
</body>
</html>
