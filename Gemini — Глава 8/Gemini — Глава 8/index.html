<body>
<header><div class="brand"><span class="brand-mark">08</span><span>Сетевые технологии</span></div><div class="header-actions"><button class="plain" id="contents">Содержание</button><button class="plain" id="fullscreen" title="Полноэкранный режим">На весь экран ⛶</button></div></header>
<main id="deck" aria-label="Презентация: транспортный уровень"></main>
<div class="footer-label" id="section-label">Глава 8 / Транспортный уровень</div>
<nav class="nav" aria-label="Навигация по слайдам"><button id="prev" aria-label="Предыдущий слайд">←</button><span class="counter" id="counter" aria-live="polite"></span><button id="next" aria-label="Следующий слайд">→</button></nav><div class="progress" id="progress"></div>
<script>
const slides=[];
const add=(section,title,body,theme='',source='')=>slides.push({section,title,body,theme,source});
const note=t=>`<div class="note">${t}</div>`;
const rows=a=>`<div class="rows">${a.map((t,i)=>`<div class="row"><span class="n">0${i+1}</span><p>${t}</p></div>`).join('')}</div>`;
const table=(heads,rs)=>`<div class="table-wrap"><table><thead><tr>${heads.map(t=>`<th scope="col">${t}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const sequence=(id,steps)=>`<div class="sequence" id="${id}"><div class="endpoints"><span>Клиент А</span><span>Сервер Б</span></div>${steps.map((s,i)=>`<div class="step ${s[2]?'reverse':''}"><b>${s[0]} ${s[2]?'←':'→'}</b>${s[1]}</div>`).join('')}</div><div class="actions"><button class="btn" data-play="${id}">▶ Показать обмен</button></div><p class="status" id="${id}-status" aria-live="polite">Схема показывает весь обмен. Запустите, чтобы пройти его по шагам.</p>`;
const hero=`<svg class="hero-net" viewBox="0 0 620 520" role="img" aria-label="Схема передачи сегментов между двумя приложениями"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#6779ed"/><stop offset="1" stop-color="#2b377e"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b5c3ff" stroke-width="1.5"/></marker></defs><path d="M80 185L310 55L550 190L315 330Z" fill="none" stroke="#7180cf" opacity=".4"/><path d="M80 275L310 145L550 280L315 420Z" fill="none" stroke="#7180cf" opacity=".4"/><path d="M80 365L310 235L550 370L315 510Z" fill="none" stroke="#7180cf" opacity=".4"/><path d="M130 290L475 290" stroke="#b5c3ff" stroke-width="3" stroke-dasharray="6 9" marker-end="url(#arrow)"/><g transform="translate(42 130)"><path d="M0 0H175V108H0Z" fill="#19244e" stroke="#91a4ff" stroke-width="2"/><path d="M0 0L20 -20H195L175 0M175 0L195 -20V88L175 108" fill="#3d4fa2" stroke="#91a4ff"/><text x="18" y="37" fill="#a4b5fa" font-size="12">ИСТОЧНИК</text><text x="18" y="75" fill="white" font-size="24" font-weight="600">Приложение</text></g><g transform="translate(359 322)"><path d="M0 0H190V108H0Z" fill="#19244e" stroke="#91a4ff" stroke-width="2"/><path d="M0 0L20 -20H210L190 0M190 0L210 -20V88L190 108" fill="#3d4fa2" stroke="#91a4ff"/><text x="18" y="37" fill="#a4b5fa" font-size="12">НАЗНАЧЕНИЕ</text><text x="18" y="75" fill="white" font-size="24" font-weight="600">Приложение</text></g><g transform="translate(234 200)"><path d="M0 0L86 -49L155 -8L69 41Z" fill="#adbaff"/><path d="M0 0V48L69 89V41Z" fill="url(#g)"/><path d="M69 41L155 -8V40L69 89Z" fill="#465bc6"/><text x="38" y="11" fill="#141c47" font-size="20" font-weight="800">TCP</text></g><g transform="translate(270 121)"><path d="M0 0L70 -40L126 -7L56 33Z" fill="#d8f789"/><path d="M0 0V30L56 63V33Z" fill="#8aab44"/><path d="M56 33L126 -7V23L56 63Z" fill="#b6d96b"/><text x="24" y="8" fill="#1c342d" font-size="18" font-weight="800">UDP</text></g><text x="55" y="470" fill="#a8b8ec" font-size="12" letter-spacing="3">ДАННЫЕ МЕЖДУ ПРОЦЕССАМИ</text></svg>`;
add('Глава 8','Транспортный уровень',`<div><p class="eyebrow">Глава 08 / Модель OSI</p><h1>Транспортный<br><span>уровень</span></h1><p class="lead">Как данные находят нужное приложение и что делает передачу надёжной.</p><div class="actions"><button class="btn light" data-go="2">Начать изучение →</button><button class="plain" data-go="1" style="color:white;border-color:#64709c">Карта главы</button></div><p class="small spaced">TCP · UDP · Порты · Управление потоком</p></div><div><span class="cover-index">08</span>${hero}</div>`,'dark cover');
add('Навигация','Карта главы',`<p class="lead">От роли транспортного уровня до надёжной доставки и выбора протокола.</p><div class="toc-list spaced">${[['01','Основы','Сегментация и мультиплексирование',2],['02','Адресация','Порты, сокеты и службы',5],['03','Протокол TCP','Заголовок, флаги и соединение',9],['04','Надёжная передача','ACK, окно и повторная отправка',14],['05','Протокол UDP','Датаграммы и области применения',20],['06','Закрепление','Сравнение, практика и выводы',24]].map(x=>`<button class="toc-item" data-go="${x[3]}"><span>${x[0]}</span><div><strong>${x[1]}</strong><small>${x[2]}</small></div><span>↗</span></button>`).join('')}</div>`);
add('01 / Основы','Связь между приложениями',`<div class="two"><div><p class="lead">Транспортный уровень занимает четвёртое место в модели OSI и обслуживает обмен данными между процессами.</p>${rows(['Принимает данные приложений и передаёт их нижним уровням.','Различает одновременные потоки с помощью портов.','TCP добавляет надёжность, UDP передаёт отдельные датаграммы.'])}</div><div class="stack">${['Прикладной','Представления','Сеансовый','Транспортный','Сетевой','Канальный','Физический'].map((n,i)=>`<div class="${i===3?'selected':''}"><b>${7-i}</b><span>${n}${i===3?' · TCP / UDP':''}</span></div>`).join('')}</div></div>`,'','Лекция, с. 1; презентация PDF, с. 3.');
add('01 / Основы','Большой поток, небольшие сегменты',`<div class="two"><div><p class="lead">TCP делит поток байтов на сегменты. Каждый получает заголовок с данными для доставки и сборки.</p><div class="packets"><span class="packet">01</span><span class="packet">02</span><span class="packet">03</span><span class="packet">…</span></div><p>Небольшие части удобнее передавать вперемежку с другим трафиком и повторять при потере.</p></div><div class="panel"><label for="file-size">Размер файла: <span id="file-label">300</span> кБ</label><input id="file-size" type="range" min="10" max="1000" step="10" value="300"><output id="segments">206</output><p>сегментов при 1460 байтах данных</p><p class="small spaced">Учебный расчёт: ⌈размер / 1460⌉.<br>Здесь 1 кБ = 1000 байт. Размер полезной нагрузки зависит от сети и заголовков.</p></div></div>${note('1460 байт — пример для TCP поверх IPv4 при MTU 1500 и заголовках IP/TCP по 20 байт. Это не универсальный размер.')}`,'','Лекция, с. 1–2.');
add('01 / Основы','Несколько потоков в одном канале',`<p class="lead">Мультиплексирование позволяет чередовать данные разных приложений. На приёмной стороне порты помогают разделить потоки.</p><div class="three spaced"><div><h3>Веб</h3><span class="pill">TCP</span></div><div><h3>Передача файлов</h3><span class="pill">TCP</span></div><div><h3>Голос</h3><span class="pill">UDP</span></div></div><div class="rail spaced"><div class="packets"><span class="packet">Веб 1</span><span class="packet alt">Файл 1</span><span class="packet third">Голос 1</span><span class="packet">Веб 2</span><span class="packet third">Голос 2</span><span class="packet alt">Файл 2</span></div></div>${note('Общий канал переносит несколько потоков. Само мультиплексирование не гарантирует равную полосу каждому приложению.')}`,'','Лекция, с. 2; презентация PDF, с. 5.');
add('02 / Адресация','IP находит узел. Порт находит процесс.',`<div class="two"><div><p class="lead">Порт — 16-битный номер в заголовке TCP или UDP. Он помогает передать данные нужному приложению на устройстве.</p><div class="metric spaced">0–65535</div><p class="small">Диапазон значений номера порта</p></div><div class="panel"><p class="small">КОНЕЧНАЯ ТОЧКА</p><div class="socket spaced">192.168.1.19<em>:80</em></div>${rows(['IP-адрес указывает устройство.','Порт 80 соответствует HTTP в примере.','TCP и UDP имеют отдельные пространства портов.'])}</div></div>`,'','Лекция, с. 3.');
add('02 / Адресация','В ответе адреса и порты меняются местами',`<div class="two"><div><h3>Запрос клиента</h3><div class="panel"><p class="small">ИСТОЧНИК</p><p class="mono">192.168.1.23:<b>51345</b></p><p class="small spaced">НАЗНАЧЕНИЕ</p><p class="mono">192.168.1.2:<b>80</b></p></div></div><div><h3>Ответ сервера</h3><div class="panel"><p class="small">ИСТОЧНИК</p><p class="mono">192.168.1.2:<b>80</b></p><p class="small spaced">НАЗНАЧЕНИЕ</p><p class="mono">192.168.1.23:<b>51345</b></p></div></div></div>${note('Сокет как конечная точка задаётся парой IP:порт. TCP-соединение различается по паре таких точек: адресам и портам обеих сторон.')}`,'','Лекция, с. 4–5. Термин «сокет» уточнён относительно формулировки источника.');
add('02 / Адресация','Три диапазона портов',`<div class="three spaced"><div class="range"><div class="metric">0–1023</div><h3 class="spaced">Общеизвестные</h3><p>Стандартные службы: HTTP, SSH, DNS.</p></div><div class="range"><div class="metric">1024–49151</div><h3 class="spaced">Зарегистрированные</h3><p>Порты служб, зарегистрированные IANA. Например, RADIUS: 1812.</p></div><div class="range"><div class="metric">49152–65535</div><h3 class="spaced">Динамические</h3><p>Частные порты. Подходят для временных клиентских соединений.</p></div></div>${note('Сервер обычно слушает известный порт. Клиенту система выбирает свободный локальный порт; конкретный диапазон зависит от ОС.')}`,'','Лекция, с. 6; презентация PDF, с. 8; реестр IANA.');
add('02 / Адресация','Порты, которые встречаются чаще всего',`${table(['Служба','Порт','Служба','Порт'],[['HTTP / HTTPS','80 / 443','DNS','53'],['SSH / Telnet','22 / 23','SMTP','25'],['FTP: команды','21','POP3 / IMAP','110 / 143'],['FTP: данные¹','20','NTP','123'],['TFTP','69','DHCP: сервер / клиент','67 / 68']])}<p class="caption">¹ Порт 20 относится к передаче данных FTP в активном режиме.</p>${note('В исходной таблице порты DHCP переставлены. Правильно: сервер — 67, клиент — 68. <a href="https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml" target="_blank" rel="noopener">Реестр IANA ↗</a>')}`,'','Лекция, с. 4; презентация PDF, с. 6.');
add('03 / TCP','Надёжный поток байтов',`<div class="two"><div><div class="metric">TCP</div><p class="lead spaced">Transmission Control Protocol</p><p class="spaced">Соединение, подтверждения и повторные передачи помогают доставлять приложению данные в исходном порядке.</p></div><div>${rows(['Устанавливает соединение до обмена данными.','Нумерует байты и отслеживает подтверждения.','Восстанавливает потери и ограничивает поток по возможностям получателя.'])}</div></div>${note('Надёжность не означает, что связь никогда не оборвётся: TCP может завершить соединение с ошибкой.')}`,'dark','Лекция, с. 6–7.');
add('03 / TCP','Что находится в заголовке TCP',`<div class="two"><div><div class="header-grid"><button class="field" data-info="Порт источника: 16 бит. Определяет локальное приложение отправителя.">Порт источника<small>16 бит</small></button><button class="field" data-info="Порт назначения: 16 бит. Определяет приложение получателя.">Порт назначения<small>16 бит</small></button><button class="field wide accent" data-info="Sequence Number: 32 бита. Номер первого байта данных сегмента. SYN также занимает один номер.">Порядковый номер<small>32 бита</small></button><button class="field wide accent" data-info="Acknowledgment Number: 32 бита. Номер следующего ожидаемого байта; имеет значение при установленном ACK.">Номер подтверждения<small>32 бита</small></button><div class="field">Длина / резерв / флаги</div><button class="field" data-info="Window: 16 бит. Объявляет объём данных, который получатель готов принять. Масштабирование окна согласуется отдельно.">Размер окна<small>16 бит</small></button><div class="field">Контрольная сумма</div><div class="field">Указатель срочности</div><div class="field wide">Опции и выравнивание, если есть</div></div><p class="field-info" id="field-info" aria-live="polite">Нажмите на порт, номер или окно, чтобы прочитать назначение поля.</p></div><div><div class="metric">20–60</div><h3>байт заголовка</h3><p>Основная часть занимает 20 байт. Опции могут увеличить длину до 60 байт.</p><p class="small spaced">Схема группирует служебные биты для чтения. Длина заголовка задаётся 32-битными словами; данные идут после него.</p></div></div>`,'','Лекция, с. 7–8; RFC 9293.');
add('03 / TCP','Флаги управляют соединением',`<div class="flags">${[['SYN','Синхронизация начальных порядковых номеров.'],['ACK','Поле номера подтверждения действительно.'],['FIN','Отправитель закончил передачу данных.'],['RST','Сброс соединения.'],['PSH','Запрос на передачу данных принимающему приложению без ожидания заполнения буфера.'],['URG','Поле указателя срочности действительно.']].map(x=>`<div class="flag"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div>${note('Это шесть флагов, разобранных в лекции. Современный формат TCP также включает флаги ECN. URG не задаёт приоритет пакета в сети.')}`,'','Лекция, с. 8–9; RFC 9293.');
add('03 / TCP','Соединение начинается с трёх шагов',`<div class="two"><div><p class="lead">Каждая сторона сообщает свой начальный номер и подтверждает номер другой стороны.</p><p class="spaced">В учебном примере ISN клиента = 100, ISN сервера = 500.</p>${note('SYN занимает один номер последовательности. Первые байты данных будут иметь номера 101 и 501.')}</div><div>${sequence('handshake',[['SYN','SEQ = 100',false],['SYN + ACK','SEQ = 500, ACK = 101',true],['ACK','SEQ = 101, ACK = 501',false]])}</div></div>`,'','Лекция, с. 9–12. Числа в анимации — учебный пример.');
add('03 / TCP','Как прочитать обмен в Wireshark',`${table(['Шаг','Источник → назначение','SEQ','ACK'],[['SYN','Клиент:54824 → сервер:443','0','—'],['SYN, ACK','Сервер:443 → клиент:54824','0','1'],['ACK','Клиент:54824 → сервер:443','1','1']])}<div class="two spaced"><div><h3>Относительные номера</h3><p>Wireshark может показывать начало каждого направления как 0. Это удобное представление, а не реальный ISN.</p></div><div><h3>Реальные номера</h3><p class="mono">Клиент: 3638817700<br>Сервер: 1565342372</p><p class="small spaced">Значения из захвата в лекции. Обычный ACK без данных не увеличивает SEQ.</p></div></div>`,'','Лекция, с. 10–12.');
add('04 / Надёжность','ACK называет следующий ожидаемый байт',`<p class="lead">Порядковые номера TCP относятся к байтам. Подтверждение охватывает непрерывно полученные данные.</p><div class="timeline spaced"><span>SEQ 1<br><br>байты 1–1000</span><span>SEQ 1001<br><br>байты 1001–2000</span><span>SEQ 2001<br><br>байты 2001–3000</span></div><div class="two spaced"><div class="metric">ACK 3001</div><p>Получатель принял байты до 3000 включительно и ждёт байт 3001.</p></div>${note('Для сегмента с 1000 байтами данных следующий SEQ увеличится на 1000. SYN и FIN отдельно занимают по одному номеру.')}`,'','Лекция, с. 13–15; RFC 9293.');
add('04 / Надёжность','Окно ограничивает данные «в пути»',`<div class="two"><div><p class="lead">Получатель объявляет, сколько байт готов принять. Отправитель учитывает окно, пока ждёт подтверждение.</p><label class="spaced" style="display:block" for="window-size">Окно приёма: <b id="window-label">3000</b> байт</label><input id="window-size" type="range" min="1000" max="6000" step="1000" value="3000"><p class="small">В демонстрации один блок содержит 1000 байт. Показано только ограничение по окну приёма.</p></div><div><div class="window-blocks" id="window-blocks">${Array.from({length:6},(_,i)=>`<span class="${i<3?'allowed':''}">${i*1000+1}<br>…<br>${(i+1)*1000}</span>`).join('')}</div><div class="actions"><button class="btn" id="window-ack">Подтвердить блоки</button><button class="plain" id="window-reset">Сбросить</button></div><p class="status" id="window-status" aria-live="polite">Можно отправить 3000 байт до получения ACK.</p></div></div>${note('После подтверждения окно сдвигается. Скорость также ограничивает управление перегрузкой сети; окно приёма защищает буфер получателя.')}`,'','Лекция, с. 13; RFC 9293.');
add('04 / Надёжность','Потеря оставляет пробел в потоке',`<div class="two"><div><div class="timeline"><span>Получено<br><br>1–3000</span><span class="lost">Потеряно<br><br>3001–6000</span><span>Получено<br><br>6001–9000</span></div><div class="metric spaced">ACK 3001</div><p class="spaced">Подтверждение не проходит через пробел. Получатель всё ещё ждёт байт 3001.</p></div><div>${sequence('retry',[['Данные 1–3000','Получатель отвечает ACK 3001.',false],['Данные 3001–6000','Сегмент теряется в сети.',false],['Повторная передача','После тайм-аута отправитель повторяет потерянные данные.',false],['ACK 9001','Если поздние байты сохранены, весь диапазон теперь непрерывен.',true]])}</div></div>`,'','Лекция, с. 13–14. Упрощённый сценарий с тайм-аутом.');
add('04 / Надёжность','Порядок восстанавливается у получателя',`<div class="two"><div><h3>Порядок прихода</h3><div class="packets" id="order-packets"><span class="packet" data-order="2">1001–2000</span><span class="packet" data-order="1">1–1000</span><span class="packet" data-order="3">2001–3000</span></div><div class="actions"><button class="btn" id="sort-packets">Собрать поток</button><button class="plain" id="sort-reset">Повторить</button></div></div><div><p class="lead">Сеть может доставить сегменты в другом порядке. TCP использует SEQ и передаёт приложению упорядоченный поток.</p><p class="status" id="order-status" aria-live="polite">Получены три сегмента: второй, первый, третий.</p></div></div>${note('Приложение получает поток байтов. Границы отдельных TCP-сегментов не являются границами сообщений приложения.')}`,'','Лекция, с. 15; RFC 9293.');
add('04 / Надёжность','Каждое направление закрывается отдельно',`<div class="two"><div><p class="lead">FIN сообщает, что сторона закончила отправлять данные. Другая сторона подтверждает FIN и затем завершает свою передачу.</p>${note('ACK и FIN сервера могут объединяться в один сегмент. Поэтому завершение не всегда требует четырёх отдельных сегментов.')}</div><div>${sequence('closing',[['FIN','Клиент закончил отправку.',false],['ACK','Сервер подтвердил FIN клиента.',true],['FIN','Сервер тоже закончил отправку.',true],['ACK','Клиент подтвердил FIN сервера.',false]])}</div></div>`,'','Лекция, с. 14–15.');
add('04 / Надёжность','Три механизма, три разные задачи',`<div class="three"><div class="range"><h3>Надёжность</h3><p>SEQ, ACK и повторная передача восстанавливают порядок и потери.</p></div><div class="range"><h3>Управление потоком</h3><p>Объявленное окно ограничивает нагрузку на получателя.</p></div><div class="range"><h3>Управление перегрузкой</h3><p>Отправитель учитывает состояние сети и ограничивает объём данных в пути.</p></div></div>${note('Два числа Window из противоположных направлений относятся к разным получателям. Одно их различие не доказывает изменение окна одной стороны.')}`,'','Уточнение к лекции, с. 11–13; RFC 9293.');
add('05 / UDP','Отдельная датаграмма. Минимум служебных действий.',`<div class="two"><div><div class="metric">UDP</div><p class="lead spaced">User Datagram Protocol</p><p class="spaced">Приложение отправляет датаграммы без предварительного транспортного соединения.</p></div><div>${rows(['Нет встроенного подтверждения доставки.','Нет встроенных повторов и восстановления порядка.','Заголовок занимает всего 8 байт.'])}</div></div>${note('UDP уменьшает служебные затраты, но не обещает более высокую скорость в любых условиях.')}`,'dark','Лекция, с. 16–17.');
add('05 / UDP','Заголовок UDP: четыре поля',`<div class="two"><div><div class="header-grid"><div class="field">Порт источника<small>16 бит</small></div><div class="field">Порт назначения<small>16 бит</small></div><div class="field accent">Длина<small>16 бит</small></div><div class="field accent">Контрольная сумма<small>16 бит</small></div><div class="field wide" style="background:#eef1fa">Данные приложения</div></div><p class="caption">Длина включает заголовок и данные. Область данных не входит в 8 байт заголовка.</p></div><div><div class="metric">8 байт</div><p class="spaced">Нет полей SEQ, ACK или окна. UDP сохраняет границы отдельных сообщений.</p></div></div>${note('Контрольная сумма UDP охватывает заголовок, данные и псевдозаголовок IP. В лекции её область описана неполно. <a href="https://www.rfc-editor.org/rfc/rfc768" target="_blank" rel="noopener">RFC 768 ↗</a>')}`,'','Лекция, с. 16–17.');
add('05 / UDP','Потерянная датаграмма не повторяется самим UDP',`<p class="lead">Данные продолжают поступать. Восстановление, если оно требуется, должно обеспечить приложение или протокол поверх UDP.</p><div class="rail spaced"><div class="packets"><span class="packet">Датаграмма 1</span><span class="packet missing">Потеря</span><span class="packet">Датаграмма 3</span><span class="packet">Датаграмма 4</span></div></div><div class="two spaced"><div><h3>Что получает приложение</h3><p>Доставленные датаграммы. UDP не собирает их в надёжный поток.</p></div><div><h3>Что решает приложение</h3><p>Пропустить потерю, запросить повтор или использовать собственный механизм восстановления.</p></div></div>`,'','Лекция, с. 16–17. Номера показаны для объяснения, в заголовке UDP их нет.');
add('05 / UDP','Когда используют UDP',`<div class="three"><div class="range"><span class="pill">Реальное время</span><h3 class="spaced">VoIP</h3><p>Для голоса своевременность очередного фрагмента может быть важнее повтора устаревшего.</p></div><div class="range"><span class="pill">Запрос и ответ</span><h3 class="spaced">DHCP, DNS</h3><p>Короткий обмен без установления TCP-соединения. DNS также использует TCP.</p></div><div class="range"><span class="pill">Контроль в приложении</span><h3 class="spaced">TFTP</h3><p>Подтверждения и повторы реализует сам протокол TFTP поверх UDP.</p></div></div>`,'','Лекция, с. 17; презентация PDF, с. 23.');
add('06 / Закрепление','TCP и UDP: сравнение',`${table(['Свойство','TCP','UDP'],[['Модель данных','Поток байтов','Датаграммы'],['Соединение','Устанавливается','Не устанавливается'],['Порядок','Восстанавливается','Не восстанавливается'],['Подтверждения и повторы','Есть','Нет на уровне UDP'],['Управление потоком','Есть','Нет встроенного'],['Заголовок','20–60 байт','8 байт'],['Примеры из главы','Почта, FTP, HTTP, DNS','VoIP, DHCP, TFTP, DNS']])}${note('Выбор определяется требованиями приложения. Сравнивать только «скорость» недостаточно.')}`,'','Лекция, с. 17; сравнение дополнено моделью данных.');
add('06 / Закрепление','Проверьте понимание',`${[['Какой ACK ожидается после байтов 1–3000 без пропусков?',['3000','3001','3'],1,'ACK указывает следующий ожидаемый байт: 3001.'],['Какой порт обычно слушает DHCP-сервер?',['67','68','53'],0,'Сервер использует порт 67, клиент — 68.'],['Кто повторяет потерянные данные в TFTP поверх UDP?',['Сам UDP','Протокол TFTP','IP'],1,'TFTP реализует подтверждения и повторы поверх UDP.']].map((q,i)=>`<div class="question" data-correct="${q[2]}" data-explanation="${q[3]}"><h3>${i+1}. ${q[0]}</h3><div class="answers">${q[1].map((a,j)=>`<button class="answer" data-choice="${j}">${a}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p></div>`).join('')}`);
add('06 / Закрепление','Вопросы для обсуждения',`${[['Почему для адресации приложений недостаточно IP?','На одном узле работает несколько приложений. Порты позволяют различать конечные точки обмена.'],['Почему SYN увеличивает номер последовательности?','SYN занимает один номер, чтобы его можно было подтвердить. Первый байт данных использует ISN + 1.'],['Получены байты 1–3000 и 6001–9000. Чему равен ACK?','3001. Непрерывная последовательность заканчивается байтом 3000.'],['Почему небольшое окно замедляет отправителя?','Получатель разрешает держать в пути меньше неподтверждённых байтов. Для продолжения может потребоваться ACK или обновление окна.'],['Можно ли построить надёжную передачу поверх UDP?','Да. Подтверждения, порядок и повторы должен реализовать вышележащий протокол, как это делает TFTP.']].map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}`);
add('06 / Итоги','Что остаётся после главы',`<div class="two"><div><h1 style="font-size:clamp(46px,5.3vw,88px)">Данные.<br>Приложения.<br><span style="color:#b0baff">Доставка.</span></h1></div><div>${rows(['Транспортный уровень связывает процессы. Порты уточняют адрес доставки.','TCP предоставляет надёжный упорядоченный поток и управляет передачей.','UDP передаёт датаграммы с небольшим заголовком; дополнительные гарантии задаёт приложение.'])}<div class="actions"><button class="btn light" data-go="25">Повторить вопросы</button><button class="plain" data-go="1" style="color:white;border-color:#63709a">К карте главы</button></div></div></div>`,'dark');
add('Материалы','Источники и уточнения',`<div class="two" style="align-items:start"><div><h3>Материалы главы</h3><p style="font-size:18px"><a href="sources/Глава 8. Транспортный уровень(лекция).pdf" target="_blank">Лекция · 17 страниц ↗</a></p><p style="font-size:18px"><a href="sources/Глава 8. Транспортный уровень.pdf" target="_blank">Исходная презентация PDF ↗</a></p><p style="font-size:18px"><a href="sources/8.odp [восстановлен].pptx">Исходная презентация PPTX ↗</a></p><p class="small spaced">Оформление опирается на предоставленный style-reference.png. Схемы заново собраны для читаемости и адаптации к экрану. Локальные шрифты: Oswald и Inter.</p><h3 class="spaced">Проверка формулировок</h3><p style="font-size:17px"><a href="https://www.rfc-editor.org/rfc/rfc9293" target="_blank" rel="noopener">RFC 9293 · TCP ↗</a><br><a href="https://www.rfc-editor.org/rfc/rfc768" target="_blank" rel="noopener">RFC 768 · UDP ↗</a><br><a href="https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml" target="_blank" rel="noopener">IANA · Реестр портов ↗</a></p></div><div><h3>Что уточнено относительно лекции</h3><ul style="padding-left:22px"><li style="font-size:17px">DHCP: сервер 67, клиент 68.</li><li style="font-size:17px">Сокет как конечная точка — IP:порт; соединение задаёт пара конечных точек.</li><li style="font-size:17px">SEQ нумерует байты; ACK без данных не увеличивает SEQ.</li><li style="font-size:17px">Window разных направлений относится к разным получателям.</li><li style="font-size:17px">URG не задаёт сетевой приоритет; список шести флагов в лекции не исчерпывает современный заголовок.</li><li style="font-size:17px">Контрольная сумма UDP охватывает и данные. Размер 1460 и преимущество UDP по задержке не универсальны.</li></ul></div></div>`);
const deck=document.getElementById('deck');
deck.innerHTML=slides.map((s,i)=>`<section class="slide ${s.theme}" id="slide-${i+1}" aria-label="${i+1}. ${s.title}" aria-hidden="true"><div class="inner">${s.theme.includes('cover')?'':`<p class="eyebrow">${s.section}</p><h2 tabindex="-1">${s.title}</h2>`}${s.body}${s.source?`<p class="source">${s.source}</p>`:''}</div></section>`).join('');
let current=0,timers=[];
function clearDemo(){timers.forEach(clearTimeout);timers=[];document.querySelectorAll('.sequence.running').forEach(s=>{s.classList.remove('running');s.querySelectorAll('.step').forEach(e=>e.classList.remove('seen','current'));document.getElementById(s.id+'-status').textContent='Схема показывает весь обмен. Можно запустить повтор.'});}
function go(n,focus=false){if(document.activeElement?.closest(".slide"))document.activeElement.blur();clearDemo();current=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll('.slide').forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',String(i!==current));if(i===current)s.scrollTop=0;});document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('progress').style.width=(current+1)/slides.length*100+'%';document.getElementById('section-label').textContent=slides[current].section;history.replaceState(null,'','#'+(current+1));if(focus)document.querySelector('.slide.active h2')?.focus({preventScroll:true});}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('contents').onclick=()=>go(1,true);
document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch{document.getElementById('fullscreen').textContent='Используйте F11';}};
document.addEventListener('fullscreenchange',()=>document.getElementById('fullscreen').textContent=document.fullscreenElement?'Выйти из экрана ⛶':'На весь экран ⛶');
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,a,summary,[contenteditable="true"]')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1);}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(Number(b.dataset.go),true);const f=e.target.closest('[data-info]');if(f)document.getElementById('field-info').textContent=f.dataset.info;const play=e.target.closest('[data-play]');if(play){clearDemo();const s=document.getElementById(play.dataset.play),steps=[...s.querySelectorAll('.step')],out=document.getElementById(s.id+'-status');if(matchMedia('(prefers-reduced-motion: reduce)').matches){out.textContent='Обмен завершён. Все этапы показаны выше.';return;}s.classList.add('running');play.textContent='↻ Повторить обмен';steps.forEach((step,i)=>timers.push(setTimeout(()=>{steps.forEach(x=>x.classList.remove('current'));step.classList.add('seen','current');out.textContent=`Шаг ${i+1} из ${steps.length}. ${step.textContent}`;},i*1400)));timers.push(setTimeout(()=>{s.classList.remove('running');steps.forEach(x=>x.classList.remove('current'));out.textContent='Обмен завершён. Можно запустить повтор.';},steps.length*1400));}const a=e.target.closest('[data-choice]');if(a){const q=a.closest('.question'),ok=a.dataset.choice===q.dataset.correct;q.querySelectorAll('.answer').forEach(x=>{x.classList.remove('wrong','correct');x.setAttribute('aria-pressed','false')});a.classList.add(ok?'correct':'wrong');a.setAttribute('aria-pressed','true');q.querySelector('.feedback').textContent=(ok?'Верно. ':'Попробуйте ещё раз. ')+(ok?q.dataset.explanation:'');}});
document.getElementById('file-size').oninput=e=>{document.getElementById('file-label').textContent=e.target.value;document.getElementById('segments').textContent=Math.ceil(e.target.value*1000/1460);};
let windowDone=false;function updateWindow(){const n=Number(document.getElementById('window-size').value);document.getElementById('window-label').textContent=n;document.querySelectorAll('#window-blocks span').forEach((s,i)=>{s.className=i<n/1000?(windowDone?'done':'allowed'):''});document.getElementById('window-status').textContent=windowDone?`Получен ACK ${n+1}. Окно сдвигается: следующий диапазон ${n+1}–${2*n}.`:`Можно отправить ${n} байт до получения ACK.`;document.getElementById('window-ack').disabled=windowDone;}
document.getElementById('window-size').oninput=()=>{windowDone=false;updateWindow()};document.getElementById('window-ack').onclick=()=>{windowDone=true;updateWindow()};document.getElementById('window-reset').onclick=()=>{windowDone=false;updateWindow()};
function order(sorted){const box=document.getElementById('order-packets');[...box.children].sort((a,b)=>sorted?a.dataset.order-b.dataset.order:[2,1,3].indexOf(+a.dataset.order)-[2,1,3].indexOf(+b.dataset.order)).forEach(x=>box.appendChild(x));document.getElementById('order-status').textContent=sorted?'Поток восстановлен: байты 1–3000 передаются приложению.':'Получены три сегмента: второй, первый, третий.';document.getElementById('sort-packets').disabled=sorted;}
document.getElementById('sort-packets').onclick=()=>order(true);document.getElementById('sort-reset').onclick=()=>order(false);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearDemo()});window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>=1&&n<=slides.length)go(n-1)});const initial=Number(location.hash.slice(1));go(Number.isInteger(initial)&&initial>=1?initial-1:0);
</script></body></html>
